<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>besties only 🤫</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
<!-- this page receives /besties/<code>; never hand that URL to another host -->
<meta name="referrer" content="no-referrer" />

<!-- A personalised link resolves through THIS page, so anything a chat app knows
     about it, it learns here. Says nothing about the party, on purpose: the card
     should make someone curious, not brief them. Note the ceiling — GitHub Pages
     serves this file with a 404 status, and most crawlers won't build a preview
     card for a 404 at all, so these tags only help the ones that do. -->
<meta property="og:type" content="website" />
<meta property="og:title" content="besties only 🤫" />
<meta property="og:description" content="Khushi left you something." />
<meta property="og:image" content="https://secretslumberparty.com/besties/og.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="besties only 🤫" />
<meta name="twitter:description" content="Khushi left you something." />
<meta name="twitter:image" content="https://secretslumberparty.com/besties/og.jpg" />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<style>
  html,body{ height:100%; margin:0; background:#12040c; color:#f5c3cf;
    font-family:'Caveat',cursive,system-ui,sans-serif; display:grid; place-items:center; }
  a{ color:#eb648c; }
  p{ font-size:1.6rem; opacity:.8; }
  /* While we're working out whether this is an invite, show NOTHING but the
     background. "nothing to see here" flashing up before a guest's own greeting
     is the worst possible first frame of an invitation, and it got worse when
     verification started taking a moment. The background colour still paints, so
     this reads as the page loading rather than as a blank failure. */
  html.resolving body{ visibility:hidden; }
</style>
<script>
/* Runs before <body> exists, which is the whole point — a class set here means
   the 404 copy never gets a frame on screen. Kept deliberately tiny and
   dependency-free; the real work happens in the script below. */
(function(){
  var seg = location.pathname.replace(/^\/+/,'').replace(/\/+$/,'');
  if (/^besties(\/|$)/.test(seg) || /^[a-z][a-z0-9]*-[a-z0-9]{4}$/.test(seg)) {
    document.documentElement.className = 'resolving';
  }
})();
</script>
<script>
/* GitHub Pages serves this file for any path it can't find, which is how
   personalised links work without a server: they land here and we hand the code
   to the real experience. Everything else goes home.

   TWO SHAPES OF LINK, both live:
     /besties/<code>   the original, still sent out and still working
     /<code>           root level — secretslumberparty.com/orry-aftr

   The root form is the reason this file got more careful. A bare /<code> rule is
   a catch-all: it would also swallow a mistyped page and dump a stranger on the
   private gate. So a root path is only treated as an invite if it BOTH looks
   like a code and actually resolves against the sealed guest index — the same
   100k-round derivation /besties uses. Anything else stays a real 404.

   The redirect happens before paint, so a guest never sees this page. */
(function () {
  var path = location.pathname;

  /* Show the 404 copy. Called the moment we know this isn't an invite — and by a
     safety timer, because a page that stays blank forever because some crypto
     stalled on an old phone is worse than a 404 that appears late. */
  var revealed = false;
  function reveal(){
    if (revealed) return; revealed = true;
    document.documentElement.className = '';
  }
  var guard = setTimeout(reveal, 2500);

  // ---- the original /besties/<code> form -----------------------------------
  var m = path.match(/^\/besties\/([A-Za-z0-9_-]{1,64})\/?$/);
  if (m) return location.replace('/besties/?g=' + encodeURIComponent(m[1]));
  if (/^\/besties/.test(path)) return location.replace('/besties/');

  // ---- root level: /<code> -------------------------------------------------
  var seg = path.replace(/^\/+/, '').replace(/\/+$/, '');
  // cheap gate first, so a normal 404 never pays for the crypto below
  if (!/^[a-z][a-z0-9]*-[a-z0-9]{4}$/.test(seg)) { reveal(); return; }
  if (!(window.crypto && crypto.subtle)) { reveal(); return; }   // can't verify, so don't hijack

  var s = document.createElement('script');
  s.src = '/besties/guests.js?v=73b0b160';
  s.onerror = reveal;                                 // couldn't even load the roster
  s.onload = function () {
    if (!window.BESTIES_GUESTS) return reveal();
    guestIndex(seg).then(function (idx) {
      if (window.BESTIES_GUESTS[idx]) {
        clearTimeout(guard);                          // going somewhere: stay hidden
        location.replace('/besties/?g=' + encodeURIComponent(seg));
      } else {
        reveal();                                     // code-shaped, but nobody's
      }
    }).catch(reveal);
  };
  document.head.appendChild(s);

  /* Must match tools/besties-seal.mjs and besties.js exactly — same salt, same
     rounds — or a real code won't be found and the link dies silently. */
  function guestIndex(code) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(code.toLowerCase()), 'PBKDF2', false, ['deriveBits'])
      .then(function (base) {
        return crypto.subtle.deriveBits(
          { name: 'PBKDF2', salt: enc.encode('ssp-besties-index'), iterations: 100000, hash: 'SHA-256' },
          base, 128);
      })
      .then(function (bits) {
        return Array.prototype.map.call(new Uint8Array(bits), function (b) {
          return b.toString(16).padStart(2, '0');
        }).join('');
      });
  }
})();
</script>
</head>
<body>
  <p>nothing to see here 🤫 &nbsp;<a href="/">go home</a></p>
</body>
</html>
