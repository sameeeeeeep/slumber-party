<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Invite Link Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bakbak+One&family=Teko:wght@400;500;600&family=Barlow:wght@500;600&family=Palanquin+Dark:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#75150f; --maroon-d:#4f0d09; --yellow:#efbd0d; --red:#c4221a; --pink:#ec5a86; --teal:#2f9790; --blue:#1d8cc4; --cream:#f7e6c8; --ink:#1c1410; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --maroon:#75150f; } }
  :root[data-theme="dark"] { --maroon:#75150f; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--maroon); color: var(--cream); font: 500 15px/1.4 'Barlow', system-ui, sans-serif; padding: 28px 16px 60px; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font: 400 clamp(28px, 6vw, 40px)/1.05 'Bakbak One', sans-serif; text-shadow: 2px 2px 0 var(--red); }
  .sub { opacity: .8; margin: 8px 0 26px; }
  .card { background: var(--yellow); color: var(--ink); padding: 22px; border-radius: 4px; margin-bottom: 22px;
    box-shadow: inset 0 0 0 3px var(--maroon), inset 0 0 0 6px var(--yellow), inset 0 0 0 7.5px var(--pink), inset 0 0 0 10px var(--yellow), inset 0 0 0 11.5px var(--teal); }
  h2 { font: 400 22px/1 'Bakbak One', sans-serif; margin-bottom: 14px; color: var(--ink); text-shadow: 1.5px 1.5px 0 var(--red); }
  label { display: block; font: 700 13px/1 'Palanquin Dark', sans-serif; color: var(--maroon); margin: 12px 0 6px; }
  input, textarea { width: 100%; border: 2px solid var(--maroon); border-radius: 3px; background: #fff6dc; padding: 10px 12px; font: 600 17px/1.3 'Barlow', sans-serif; color: var(--ink); }
  textarea { min-height: 150px; font-size: 15px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  button, .btn { display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 3px; cursor: pointer; text-decoration: none;
    background: var(--red); color: var(--yellow); font: 400 17px/1 'Bakbak One', sans-serif; padding: 12px 18px 10px; margin-top: 14px;
    box-shadow: inset 0 0 0 2px var(--yellow); }
  button.alt, .btn.alt { background: var(--blue); }
  .out { margin-top: 16px; display: grid; gap: 10px; }
  .link { background: #fff6dc; border: 1.5px dashed var(--maroon); border-radius: 3px; padding: 10px 12px; word-break: break-all; font-size: 14px; }
  .link b { display: block; font: 700 12px/1 'Palanquin Dark', sans-serif; color: var(--red); margin-bottom: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions button, .actions .btn { margin-top: 8px; font-size: 14px; padding: 9px 12px 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  td, th { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(117,21,15,.25); vertical-align: top; word-break: break-all; }
  th { font: 700 12px/1 'Palanquin Dark', sans-serif; color: var(--maroon); }
  .err { color: var(--red); font-weight: 600; margin-top: 8px; min-height: 1em; }
  .note { font-size: 13px; opacity: .85; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>invite link maker</h1>
  <p class="sub">Each guest gets <code>?name=their-name</code>. Opening and RSVPs show up in the sheet under that name.</p>

  <section class="card">
    <h2>guest links</h2>
    <label for="bulk">One name per line</label>
    <textarea id="bulk" placeholder="Riya&#10;Aditi Shah&#10;Kabir"></textarea>
    <label for="base">Invite page URL</label><input id="base">
    <div class="actions">
      <button id="bulkgo" type="button">make links</button>
      <button id="csv" class="alt" type="button">copy all</button>
    </div>
    <table id="tbl" hidden><thead><tr><th>Name</th><th>Link</th><th></th></tr></thead><tbody></tbody></table>
  </section>
</main>
<script src="config.js?v=1793090740"></script>
<script src="lib.js?v=1793090740"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  $('#base').value = location.href.replace(/make\.html.*$/, '');
  const url = n => `${$('#base').value.trim()}?name=${n.trim().toLowerCase().split(/\s+/).map(encodeURIComponent).join('+')}`;   // ?name=sameep+rehlan
  const copy = t => navigator.clipboard && navigator.clipboard.writeText(t);
  let rows = [];
  $('#bulkgo').onclick = () => {
    rows = $('#bulk').value.split('\n').map(l => l.trim()).filter(Boolean).map(n => ({ name: n, url: url(n) }));
    const tb = $('#tbl tbody'); tb.replaceChildren();
    rows.forEach(r => {
      const tr = document.createElement('tr');
      const a = document.createElement('td'); a.textContent = r.name;
      const b = document.createElement('td'); b.textContent = r.url;
      const c = document.createElement('td'); const btn = document.createElement('button'); btn.type = 'button'; btn.textContent = 'copy'; btn.onclick = () => copy(r.url); c.append(btn);
      tr.append(a, b, c); tb.append(tr);
    });
    $('#tbl').hidden = !rows.length;
  };
  $('#csv').onclick = () => copy(rows.map(r => `${r.name}\t${r.url}`).join('\n'));
})();
</script>
</body>
</html>
