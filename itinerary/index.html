<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>the programme 🤫 · khushi's slumber party</title>
<meta name="description" content="For guests." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;1,400&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* The guest programme. Same room as everything else — wine walls, cream cards,
     her handwriting — but this one is a document, not a conversation: guests
     glance at it between things, often on a dim phone at 1am, so it optimises
     for scanning: big times, short titles, one column. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  p,h1,h2{ margin:0; }
  html,body{ margin:0; min-height:100%; }
  body{ background:
      radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); overflow-x:hidden; }

  /* ---- the word ---- */
  #gate{ min-height:100vh; min-height:100dvh; display:grid; place-items:center; padding:1.5rem; }
  .gbox{ text-align:center; width:min(22rem,100%); }
  .gbox .shh{ font-family:var(--hand); font-size:2.2rem; color:var(--soft); }
  .gbox h1{ font-family:var(--serif); font-style:italic; font-size:2rem; margin:.4rem 0 1.4rem; color:#fff; }
  .gbox form{ display:flex; gap:.5rem; }
  .gbox input{ flex:1; min-width:0; background:rgba(255,255,255,.06);
    border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:.6rem 1.1rem;
    color:var(--cream); font-family:var(--mono); font-size:1.35rem; outline:none; text-align:center; }
  .gbox input:focus{ border-color:var(--pink); }
  .gbox button{ flex:none; border:0; cursor:pointer; border-radius:100px; padding:.55rem 1.1rem;
    font-family:var(--pixel); font-size:.6rem; letter-spacing:.06em; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .gbox .err{ min-height:1.6rem; margin-top:.8rem; font-size:1.15rem; color:#ffb3c6; }
  .gbox.no input{ animation:no .35s; }
  @keyframes no{ 20%,60%{ transform:translateX(-6px) } 40%,80%{ transform:translateX(6px) } }

  /* ---- the programme ---- */
  #prog{ display:none; max-width:34rem; margin:0 auto; padding:2.2rem 1.1rem 3.5rem; }
  #prog.on{ display:block; }
  .top{ text-align:center; margin-bottom:1.6rem; }
  /* the cream-sticker logo, not the dark-ink one — this page is wine-dark, and
     logo.png would disappear into it */
  .topLogo{ display:block; width:min(78%,19rem); height:auto; margin:0 auto .5rem;
    filter:drop-shadow(0 .35rem 1.1rem rgba(0,0,0,.35)); }
  .top h1{ font-family:var(--serif); font-style:italic; font-size:2.3rem; color:#fff; margin:.2rem 0 .3rem; }
  .top p{ font-size:1.1rem; color:var(--soft); }

  .day{ font-family:var(--pixel); font-size:.68rem; letter-spacing:.12em; text-transform:lowercase;
    color:var(--yellow); margin:2rem 0 .8rem; text-shadow:0 0 12px rgba(255,233,168,.35); }
  .day:first-of-type{ margin-top:.6rem; }

  .item{ display:flex; gap:.9rem; align-items:flex-start;
    background:rgba(255,252,253,.95); color:var(--ink); border-radius:1rem;
    padding:.8rem .95rem; margin-bottom:.55rem; box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .item.now{ outline:2px solid var(--pink); box-shadow:0 0 22px rgba(235,100,140,.45); }
  .when{ flex:none; width:5.2rem; font-size:1.25rem; line-height:1.2; color:var(--rose); padding-top:.1rem; }
  .what{ min-width:0; }
  .what b{ display:block; font-weight:400; font-size:1.4rem; line-height:1.2; }
  .what span{ display:block; font-size:1.08rem; line-height:1.3; color:rgba(43,26,34,.65); margin-top:.15rem;
    white-space:pre-wrap; overflow-wrap:anywhere; }
  .what a{ color:var(--rose); text-decoration:underline; text-underline-offset:2px; }
  .nowchip{ display:inline-flex; align-items:center; gap:.35rem; font-size:.98rem; color:var(--pink);
    margin-top:.3rem; }
  .nowchip i{ width:.45rem; height:.45rem; border-radius:100px; background:var(--pink);
    box-shadow:0 0 .5rem rgba(235,100,140,.9); animation:pulse 1.6s ease-in-out infinite; font-style:normal; }
  @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.35} }

  .foot{ text-align:center; margin-top:2.2rem; color:var(--soft); font-size:1.05rem; }
  .foot .u{ font-family:var(--hand); font-size:1.4rem; color:#ffd9e4; }
  .empty{ text-align:center; color:var(--soft); font-size:1.2rem; padding:2.5rem 0; }
</style>
</head>
<body>

<div id="gate">
  <div class="gbox" id="gbox">
    <p class="shh">shhh…</p>
    <h1>what's the word?</h1>
    <form id="gform">
      <input id="gpw" type="password" autocomplete="off" autocapitalize="none" placeholder="•••••" />
      <button type="submit">OPEN ▸</button>
    </form>
    <p class="err" id="gerr"></p>
  </div>
</div>

<div id="prog">
  <div class="top">
    <img class="topLogo" src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <h1>the programme</h1>
    <p>it updates as the day moves — check back whenever ♡</p>
  </div>
  <div id="list"></div>
  <p class="foot"><span class="u">you heard nothing 🤫</span></p>
</div>

<script src="/assets/config.js"></script>
<script>
/* ============================================================================
   /itinerary — what's happening, when.

   The word is checked by the Edge Function, never here: this file is public and
   RLS keeps the table unreadable, so the function is the only door. Once in,
   the page refetches every minute and whenever the tab comes back — the admin
   edits the same table live, so "check the programme" always means the current
   one, not the one from when the phone was last unlocked.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const gate = document.getElementById('gate');
const prog = document.getElementById('prog');
const list = document.getElementById('list');
const gerr = document.getElementById('gerr');

let PW = null;
try{ PW = sessionStorage.getItem('ssp-itin'); }catch(e){}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* escape first, THEN turn bare URLs into anchors — the order is the security:
   nothing an admin types can become markup except the links this makes.
   Trailing punctuation stays outside the link so "…MJU6." doesn't 404. */
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]*[^\s<.,)!?;:'"])/g,
  '<a href="$1" target="_blank" rel="noopener">$1</a>');

async function fetchProgramme(pw){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'') + '/functions/v1/itinerary', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey,
              Authorization:'Bearer ' + CFG.supabaseAnonKey },
    body: JSON.stringify({ password: pw })
  });
  if(r.status === 401) return { wrong:true };
  if(r.status === 429) return { rate:true };
  const j = await r.json().catch(() => ({}));
  return j.ok ? j : {};
}

function render(items){
  if(!items.length){
    list.innerHTML = '<p class="empty">nothing on the board yet — khushi\'s still scheming 🤫</p>';
    return;
  }
  // items arrive ordered by position; days appear in the order their first item does
  let html = '', day = null;
  for(const it of items){
    if(it.day !== day){ day = it.day; html += `<h2 class="day">${esc(day)}</h2>`; }
    html += `<div class="item${it.is_now ? ' now' : ''}">
      <div class="when">${esc(it.t || '—')}</div>
      <div class="what">
        <b>${it.emoji ? esc(it.emoji) + ' ' : ''}${esc(it.title)}</b>
        ${it.detail ? `<span>${linkify(it.detail)}</span>` : ''}
        ${it.is_now ? '<span class="nowchip"><i></i>happening now</span>' : ''}
      </div>
    </div>`;
  }
  list.innerHTML = html;
}

async function unlock(pw, fromSaved){
  const res = await fetchProgramme(pw);
  if(res.items){
    PW = pw;
    try{ sessionStorage.setItem('ssp-itin', pw); }catch(e){}
    gate.style.display = 'none';
    prog.classList.add('on');
    render(res.items);
    return true;
  }
  if(!fromSaved){
    const box = document.getElementById('gbox');
    gerr.textContent = res.rate ? 'too many tries — give it a while 🙏'
                     : res.wrong ? "that's not it 👀" : 'hmm, try again in a moment';
    box.classList.remove('no'); void box.offsetWidth; box.classList.add('no');
  }
  return false;
}

document.getElementById('gform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const v = document.getElementById('gpw').value.trim();
  if(v) unlock(v, false);
});

/* the day moves; so should the page — a minute of staleness at most */
setInterval(() => { if(PW && !document.hidden) unlock(PW, true); }, 60000);
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && PW) unlock(PW, true);
});

if(PW) unlock(PW, true);   // returning guest: straight in, no retyping
</script>
</body>
</html>
