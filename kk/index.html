<style>
  /* THE PREBUZZ DM. Same phone as /late and /checkin — same bubbles, same wine
     room — because it's the same khushi. Two doors out of one question: the
     people who applied to the slumber party get moved into a secret chat, and
     everyone else leaves their details for something she won't name yet. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;

    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;

  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  p{ margin:0; }
  html,body{ margin:0; min-height:100%; }
  body{ background:
      radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); overflow-x:hidden; }
  /* the secret chat is a different room: the light goes gold */
  body.secret{ background:
      radial-gradient(120% 90% at 50% 0%, #3d2a18 0%, #2a1a14 46%, #170d0b 100%); }

  .wrap{ max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; }
  .head{ display:flex; align-items:center; gap:.7rem; padding:calc(.9rem + env(safe-area-inset-top,0px)) 1rem .9rem;
    border-bottom:1px solid rgba(245,195,207,.14); position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,rgba(42,21,32,.96),rgba(42,21,32,.82)); backdrop-filter:blur(8px);
    transition:background .6s ease; }
  .secret .head{ background:linear-gradient(180deg,rgba(48,32,20,.96),rgba(48,32,20,.84));
    border-bottom-color:rgba(255,233,168,.2); }
  .av{ width:2.5rem; height:2.5rem; border-radius:100px; overflow:hidden; flex:none;
    border:1px solid rgba(245,195,207,.3); }
  .av img{ width:100%; height:100%; object-fit:cover; display:block; }
  .secret .av{ border-color:var(--yellow); box-shadow:0 0 0 2px rgba(255,233,168,.25); }
  .who{ min-width:0; }
  .who b{ font-size:1.3rem; letter-spacing:.02em; display:block; line-height:1.1; }
  .who span{ font-size:1.05rem; color:var(--soft); }
  .who span i{ color:#7ddc9b; font-style:normal; }

  .thread{ flex:1; display:flex; flex-direction:column; gap:.45rem; padding:1.1rem .9rem 1.4rem; }
  .msg{ max-width:84%; font-size:1.32rem; line-height:1.3; padding:.5rem .85rem; border-radius:1.15rem;
    white-space:pre-wrap; word-wrap:break-word;
    animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both; scroll-margin-bottom:8.5rem; }
  .sys,.done,.card,.chips{ scroll-margin-bottom:8.5rem; }
  @keyframes pop{ from{ opacity:0; transform:translateY(.5rem) scale(.97) } to{ opacity:1; transform:none } }
  .her{ align-self:flex-start; background:var(--cream); color:var(--ink); border-bottom-left-radius:.3rem;
    box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .you{ align-self:flex-end; color:#fff; background:linear-gradient(120deg,var(--pink),#d8447a);
    border-bottom-right-radius:.3rem; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  .sys{ align-self:center; text-align:center; font-size:1.05rem; color:rgba(255,246,242,.55);
    background:rgba(255,255,255,.05); border-radius:.8rem; padding:.45rem .9rem; margin:.35rem 0; }
  .sys.gold{ color:var(--yellow); background:rgba(255,233,168,.08); border:1px dashed rgba(255,233,168,.35); }
  .typing{ display:flex; gap:.28rem; align-items:center; padding:.75rem .9rem; }
  .typing i{ width:.38rem; height:.38rem; border-radius:100px; background:#b2557d; animation:blink 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.16s } .typing i:nth-child(3){ animation-delay:.32s }
  @keyframes blink{ 0%,60%,100%{ opacity:.35 } 30%{ opacity:1 } }

  /* quick replies: the thing you tap instead of typing */
  .chips{ align-self:flex-end; display:flex; flex-wrap:wrap; gap:.45rem; justify-content:flex-end;
    max-width:92%; animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both; }
  .chip{ font-family:var(--mono); font-size:1.25rem; color:var(--cream); cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.4); border-radius:100px;

  .chip:hover{ border-color:var(--pink); background:rgba(235,100,140,.14); }
  .chip:active{ transform:scale(.97); }

  /* THE COUPON. A ticket, not a bubble: it's the thing they came for. */
  .card{ align-self:flex-start; width:min(84%,21rem); border-radius:1rem; padding:1rem 1.1rem;
    color:var(--ink); background:linear-gradient(135deg,#fff6d6,#ffe9a8 55%,#f7cf74);
    box-shadow:0 .5rem 1.6rem rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.5);
    position:relative; animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
  .card::before,.card::after{ content:''; position:absolute; top:50%; width:1.1rem; height:1.1rem;
    margin-top:-.55rem; border-radius:100px; background:#2a1a14; }
  .card::before{ left:-.55rem; } .card::after{ right:-.55rem; }
  .card small{ display:block; font-family:var(--pixel); font-size:.5rem; line-height:1.7; letter-spacing:.1em; opacity:.7; }
  .card .off{ font-family:var(--serif); font-style:italic; font-size:2rem; line-height:1.1; margin:.35rem 0 .5rem; }
  .card .code{ display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    border:2px dashed rgba(43,26,34,.45); border-radius:.6rem; padding:.45rem .7rem; }
  .card .code b{ font-family:var(--pixel); font-size:.85rem; letter-spacing:.08em; }
  .card .code button{ font-family:var(--pixel); font-size:.5rem; border:0; border-radius:100px; cursor:pointer;
    padding:.5rem .7rem; color:#fff; background:var(--ink); }
  .card .bind{ font-size:1.1rem; margin-top:.5rem; opacity:.8; }
  .card.used{ filter:grayscale(.7); opacity:.8; }

  a.cta, button.cta{ align-self:flex-start; display:inline-block; text-decoration:none; border:0; cursor:pointer;
    max-width:84%; font-family:var(--pixel); font-size:.7rem; line-height:1.6; letter-spacing:.05em; color:#fff;
    padding:.85rem 1.1rem; border-radius:1.15rem; border-bottom-left-radius:.3rem;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4);
    animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both; scroll-margin-bottom:8.5rem; }
  button.cta:disabled{ opacity:.55; cursor:default; box-shadow:none; }
  .cta:active{ transform:scale(.98); }

  .compose{ position:sticky; bottom:0; padding:.7rem .9rem calc(.9rem + env(safe-area-inset-bottom,0px));
    background:#1a0f16; border-top:1px solid rgba(245,195,207,.14); }
  .secret .compose{ background:#1b120d; }
  .row{ display:flex; gap:.5rem; align-items:stretch; }
  .fld{ flex:1; min-width:0; display:flex; align-items:center; gap:.4rem; min-height:var(--rowH);
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:0 .95rem; }
  .fld:focus-within{ border-color:var(--pink); background:rgba(255,255,255,.09); }
  .fld .pre{ color:var(--soft); font-size:1.35rem; }
  .fld input{ flex:1; min-width:0; background:none; border:0; outline:0; padding:0;
    color:var(--cream); font-family:var(--mono); font-size:1.35rem; }
  input::placeholder{ color:rgba(201,160,174,.75); }
  .send{ flex:none; min-height:var(--rowH); border:0; cursor:pointer; border-radius:100px;
    padding:0 1.05rem; font-family:var(--pixel); font-size:.68rem; letter-spacing:.06em; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .send:active{ transform:scale(.97); }
  .send:disabled{ opacity:.62; box-shadow:none; cursor:default; }
  .skip{ flex:none; min-height:var(--rowH); background:none; border:0; color:var(--soft); cursor:pointer;
    font-family:var(--mono); font-size:1.2rem; padding:0 .4rem; }
  .err{ color:#ffb3c6; font-size:1.1rem; padding:.35rem .3rem 0; min-height:1.4rem; }

  .done{ text-align:center; padding:1.6rem 1rem 2.4rem; }
  .done h1{ font-family:var(--serif); font-style:italic; font-size:2.2rem; margin:.2rem 0 .4rem; }
  .done p{ font-family:var(--hand); font-size:1.5rem; color:#ffd9e4; margin:.2rem 0 .8rem; }

  /* THE ONE LOOK. Full screen, no save, and when it closes the images are
     removed from the page — the URLs behind them expire in 90 seconds anyway. */
  .peek{ position:fixed; inset:0; z-index:50; background:#080406; display:flex; flex-direction:column;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .peek .bar{ display:flex; align-items:center; justify-content:space-between; gap:.6rem;
    padding:calc(.8rem + env(safe-area-inset-top,0px)) 1rem .8rem; font-size:1.2rem; color:var(--yellow); }
  .peek .bar button{ font-family:var(--pixel); font-size:.6rem; color:#fff; background:none; cursor:pointer;
    border:1px solid rgba(255,255,255,.4); border-radius:100px; padding:.6rem .9rem; }
  .peek .strip{ flex:1; min-height:0; display:flex; overflow-x:auto; scroll-snap-type:x mandatory; gap:1rem;
    padding:0 1rem calc(1rem + env(safe-area-inset-bottom,0px)); }
  .peek .strip div{ flex:0 0 100%; scroll-snap-align:center; display:grid; place-items:center; }
  .peek img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:.5rem;
    pointer-events:none; -webkit-user-drag:none; }

  @media (min-width:800px){
    body{ min-height:100dvh; display:grid; place-items:center; }
    .wrap{ width:min(30rem,100%); min-height:0; height:min(46rem, calc(100dvh - 3rem));
      border-radius:26px; overflow:hidden; border:1px solid rgba(245,195,207,.16);
      box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 100vmax rgba(10,3,8,.5); }
    .thread{ min-height:0; overflow-y:auto; overscroll-behavior:contain; }
    .thread::-webkit-scrollbar{ width:.3rem; }
    .thread::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:1rem; }
    .msg,.sys,.done,.card,.chips,.cta{ scroll-margin-bottom:0; }
    .compose{ position:static; }
  }
  @media (prefers-reduced-motion:reduce){ .msg,.card,.chips,.cta{ animation:none; } }
</style>

<body>
<div class="wrap">
  <div class="head">
    <span class="av"><img src="/assets/khushi-face.png" alt="khushi" /></span>
    <span class="who">
      <b id="title">khushi</b>
      <span id="sub">@khushikapoor · <i>●</i> online</span>
    </span>
  </div>
  <div class="thread" id="thread"></div>
  <div class="compose" id="compose" hidden>
    <div id="answer"></div>
    <p class="err" id="err" role="status" aria-live="polite"></p>
  </div>
</div>

<script src="/assets/config.js?v=2026-10-27-prebuzz"></script>
<script>
/* ============================================================================
   / in prebuzz mode — khushi's launch, before she says what it is.

   Everything a stranger can see is in this file. Everything only a slumber
   applicant may see — her secret-chat lines, the coupon, the discount, the
   photos — is NOT: it arrives from /functions/v1/prebuzz after the phone they
   type has matched a row in `applications`. View-source here shows the shape
   of the secret chat and none of its contents. See the migration
   20261027120000_prebuzz.sql for where that copy is edited.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const API = (CFG.prebuzzUrl || (CFG.supabaseUrl || '').replace(/\/$/,'') + '/functions/v1/prebuzz');
const thread = document.getElementById('thread');
const compose = document.getElementById('compose');
const answerEl = document.getElementById('answer');
const errEl = document.getElementById('err');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const TOKEN_KEY = 'ssp-pb';

function visitorId(){ try{ return localStorage.getItem('ssp-vid') || null; }catch(e){ return null; } }
function trafficSource(){
  const ua = navigator.userAgent;
  if(/Instagram/i.test(ua)) return 'instagram';
  if(/FBAN|FBAV|FB_IAB/i.test(ua)) return 'facebook';
  if(/Barcelona/i.test(ua)) return 'threads';
  if(/Snapchat/i.test(ua)) return 'snapchat';
  try{
    const q = new URLSearchParams(location.search);
    const src = q.get('src') || q.get('utm_source');
    if(src) return src.slice(0,40);
  }catch(e){}
  if(document.referrer){ try{ return new URL(document.referrer).hostname; }catch(e){} }
  return 'direct';
}
function ga(name, params){
  try{ if(window.gtag && window.ga4Ready && window.ga4Ready()) gtag('event', name, Object.assign({ ssp_vid:visitorId() }, params||{})); }catch(e){}
}

/* ---- the chat engine (same shape as /late) -------------------------------- */
function keepUp(el){
  if (getComputedStyle(thread).overflowY === 'auto') thread.scrollTo({ top: thread.scrollHeight, behavior:'smooth' });
  else el.scrollIntoView({ block:'end', behavior:'smooth' });
}
function add(el){ thread.appendChild(el); keepUp(el); return el; }
function bubble(cls, text){
  const p = document.createElement('p');
  p.className = 'msg ' + cls; p.textContent = text;
  return add(p);
}
function sys(text, cls){
  const p = document.createElement('p');
  p.className = 'sys' + (cls ? ' ' + cls : ''); p.textContent = text;
  return add(p);
}
async function her(text, beat = 700){
  const t = document.createElement('div');
  t.className = 'msg her typing'; t.innerHTML = '<i></i><i></i><i></i>';
  add(t); await sleep(beat); t.remove();
  return bubble('her', text);
}
function stampNow(){
  const d = new Date(), h = d.getHours(), m = d.getMinutes();
  return 'today · ' + (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm');
}

/* tap-to-answer: resolves with the chosen label, echoed as your bubble */
function chips(options){
  return new Promise(resolve => {
    const d = document.createElement('div'); d.className = 'chips';
    options.forEach(o => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = o.label;
      b.onclick = () => { d.remove(); bubble('you', o.label); resolve(o.value); };
      d.appendChild(b);
    });
    add(d);
  });
}

/* one text question in the compose row. `check(value)` returns an error string
   or '' — and may be async, for the questions that ask the server. */
function ask({ type = 'text', placeholder = '', pre = '', mode, auto, optional = false, max = 120, check, show }){
  return new Promise(resolve => {
    compose.hidden = false; errEl.textContent = '';
    answerEl.innerHTML =
      '<form class="row" id="f" novalidate>' +
        '<span class="fld">' + (pre ? '<span class="pre">' + pre + '</span>' : '') +
          '<input id="in" type="' + type + '" maxlength="' + max + '" /></span>' +
        (optional ? '<button class="skip" type="button" id="skip">skip</button>' : '') +
        '<button class="send" type="submit">SEND ▸</button>' +
      '</form>';
    const f = document.getElementById('f'), inp = document.getElementById('in');
    inp.placeholder = placeholder;
    if(mode) inp.inputMode = mode;
    if(auto) inp.autocomplete = auto;
    inp.focus();
    // the compose row just took space from the thread — keep the newest line in view
    if(thread.lastElementChild) keepUp(thread.lastElementChild);
    const done = (v, echo) => { compose.hidden = true; answerEl.innerHTML = ''; if(echo) bubble('you', echo); resolve(v); };
    if(optional) document.getElementById('skip').onclick = () => done(null, 'skip');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const v = inp.value.trim();
      const bad = check ? await check(v) : (v ? '' : 'say something 🙈');
      if(bad){ errEl.textContent = bad; return; }
      done(v, show ? show(v) : v);
    });
  });
}

const digits = (v) => String(v).replace(/\D/g, '').slice(-10);
const phoneOk = (v) => /^[6-9]\d{9}$/.test(digits(v)) ? '' : 'a 10-digit indian mobile number pls 📱';
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

/* ---- the server ----------------------------------------------------------- */
async function call(body, attempt = 0){
  if(!CFG.supabaseAnonKey) return { ok:false };
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey, Authorization:'Bearer ' + CFG.supabaseAnonKey },
      body: JSON.stringify(Object.assign({ visitor_id:visitorId() }, body)),
    });
    if(r.status === 429) return { ok:false, rate:true };
    if(r.status === 401) return { ok:false, session:true };
    if(r.status >= 500 && attempt === 0){ await sleep(900); return call(body, 1); }
    const j = await r.json().catch(() => ({}));
    return r.ok ? j : Object.assign({ ok:false }, j);
  }catch(e){
    if(attempt === 0){ await sleep(900); return call(body, 1); }
    return { ok:false };
  }
}
function token(v){
  try{ if(v === undefined) return localStorage.getItem(TOKEN_KEY); if(v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); }catch(e){ return null; }
}

/* ============================================================================
   THE OPEN DOOR — everyone starts here
   ========================================================================== */
async function start(){
  ga('prebuzz_landed', { source:trafficSource() });
  sys(stampNow());

  // a returning applicant goes straight back into the secret chat
  if(token()){
    const me = await call({ action:'me', token:token() });
    if(me.ok && me.chat){ return secretChat(me.chat, true); }
    if(me.session) token(null);
  }

  await sleep(400);
  await her('psst 🤫', 700);
  await her("something's coming. i can't tell you what yet", 1000);
  await her("i've been building it for months and you're early. like, actually early", 1100);
  await her('quick q first — did you apply for my secret slumber party? 🎀', 1000);
  const applied = await chips([
    { label:'yes, i applied 🎀', value:true },
    { label:"no… what's that?", value:false },
  ]);
  if(applied) return applicant();
  return stranger();
}

/* ---- "yes, i applied" ------------------------------------------------------ */
async function applicant(){
  ga('prebuzz_says_applied');
  await her('wait really?? 🥹', 700);
  await her('okay prove it 😌 which number did you apply with?', 900);
  let res, typed;
  await ask({ type:'tel', pre:'+91', placeholder:'98XXXXXXXX', mode:'numeric', auto:'tel-national', max:14,
    show:(v) => '+91 ' + digits(v),
    check: async (v) => {
      const bad = phoneOk(v); if(bad) return bad;
      typed = digits(v);
      res = await call({ action:'check', phone:typed });
      if(res.rate) return 'too many tries — give it a little while 🙏';
      if(!res.ok) return "ugh, my phone's acting up. try again?";
      return '';
    } });

  if(res.member){
    token(res.token);
    ga('prebuzz_member_unlocked');
    await her('checking my list… 👀', 1100);
    return secretChat(res.chat, false, typed);
  }
  ga('prebuzz_member_miss');
  await her("hmm. that number's not on my list 🥺", 1100);
  await her("maybe you used another one? or maybe it's a sign — either way, you can still get in early", 1200);
  return stranger(typed);
}

/* ============================================================================
   THE SECRET CHAT — everything in `chat` came from the server
   ========================================================================== */
async function secretChat(chat, returning, phone){
  document.body.classList.add('secret');
  document.getElementById('title').textContent = 'the secret chat 🔒';
  document.getElementById('sub').innerHTML = 'khushi + slumber applicants only';
  sys(returning ? 'welcome back to the secret chat' : 'khushi added you to the secret chat 🔒', 'gold');
  await sleep(500);

  if(!returning){ for(const line of chat.lines || []) await her(line, Math.min(1400, 500 + line.length * 14)); }
  else await her('you again 😌 your stuff is right where you left it', 800);

  if(chat.coupon) await couponCard(chat, phone);
  if(chat.photos > 0 && chat.photos_line){
    if(!returning) await her(chat.photos_line, 1100);
    photoButton(chat);
  }
  if(chat.hamper_line) await hamper(chat, returning);
}

function couponCard(chat, phone){
  const c = document.createElement('div');
  c.className = 'card' + (chat.coupon_used ? ' used' : '');
  c.innerHTML = '<small>EARLY ACCESS · SLUMBER APPLICANTS ONLY</small>' +
    '<div class="off"></div>' +
    '<div class="code"><b></b><button type="button">COPY</button></div>' +
    '<div class="bind"></div>';
  c.querySelector('.off').textContent = chat.coupon_used ? 'already used ♡' : (chat.discount || 'just for you');
  c.querySelector('.code b').textContent = chat.coupon;
  c.querySelector('.bind').textContent = 'only works with ' + (phone ? 'your number ••' + phone.slice(-4) : 'the number you applied with') + ' · once';
  const btn = c.querySelector('button');
  btn.onclick = async () => {
    try{ await navigator.clipboard.writeText(chat.coupon); btn.textContent = 'COPIED ♡'; ga('prebuzz_coupon_copied'); }
    catch(e){ btn.textContent = 'HOLD TO COPY'; }
  };
  add(c);
  return sleep(700);
}

function photoButton(chat){
  const b = document.createElement('button');
  b.className = 'cta'; b.type = 'button';
  if(chat.photos_seen){ b.textContent = 'YOU ALREADY PEEKED 🙈'; b.disabled = true; return add(b); }
  b.textContent = '▸ PEEK AT THE NIGHT (ONCE)';
  b.onclick = async () => {
    b.disabled = true; b.textContent = 'OPENING…';
    const r = await call({ action:'photos', token:token() });
    if(r.ok && r.urls && r.urls.length){ ga('prebuzz_photos_opened', { count:r.urls.length }); return peek(r.urls, b); }
    if(r.ok && r.seen){ b.textContent = 'YOU ALREADY PEEKED 🙈'; return; }
    b.disabled = false; b.textContent = '▸ TRY AGAIN';
  };
  add(b);
}

function peek(urls, btn){
  const o = document.createElement('div');
  o.className = 'peek';
  o.innerHTML = '<div class="bar"><span>one look. that\'s it 👀 <span id="pc"></span></span><button type="button">CLOSE</button></div><div class="strip"></div>';
  const strip = o.querySelector('.strip');
  urls.forEach(u => { const d = document.createElement('div'); const i = new Image(); i.alt = ''; i.draggable = false; i.src = u; d.appendChild(i); strip.appendChild(d); });
  o.addEventListener('contextmenu', e => e.preventDefault());
  const pc = o.querySelector('#pc'), total = urls.length;
  const count = () => { pc.textContent = (Math.round(strip.scrollLeft / Math.max(1, strip.clientWidth)) + 1) + '/' + total; };
  strip.addEventListener('scroll', count, { passive:true });
  o.querySelector('button').onclick = async () => {
    o.remove();   // the images go with it
    btn.textContent = 'GONE 🫣'; btn.disabled = true;
    await her("and that's all you get 🫣", 700);
  };
  document.body.appendChild(o); count();
}

async function hamper(chat, returning){
  if(chat.hamper === 'won'){ return her("and you WON the hamper 🎀 i'll be in touch", 900); }
  if(chat.hamper === 'entered'){ return her("you're in the hamper draw 🎀 fingers crossed", 900); }
  if(chat.hamper === 'lost'){ return; }
  if(!returning) await her(chat.hamper_line, 1300);
  else await her('still want in on the hamper? paste your post link 🎀', 900);
  await ask({ type:'url', placeholder:'instagram.com/p/…', mode:'url', max:400, optional:true,
    check: async (v) => {
      if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
      const r = await call({ action:'hamper', token:token(), url:v });
      if(r.ok) return '';
      if(r.error === 'url') return 'paste the link to your post (instagram, threads, x…) 🔗';
      if(r.session){ token(null); return 'your secret chat timed out — refresh and type your number again'; }
      return "ugh, didn't go through. try again?";
    },
    show:(v) => v }).then(async (v) => {
      if(v === null) return her('no stress — come back anytime, the link box stays here ♡', 800);
      ga('prebuzz_hamper_entered');
      await her("you're in the draw 🎀 i'll pick a few of you myself", 900);
    });
}

/* ============================================================================
   THE STRANGER — we don't say what it is, we just take their details
   ========================================================================== */
async function stranger(knownPhone){
  ga('prebuzz_lead_started');
  if(!knownPhone){
    await her("ahh okay — it was a little secret thing i did. don't worry about it 🙊", 1000);
  }
  await her("i can't say what's coming. but i can put you first in line", 1000);
  await her("what's your name?", 700);
  const name = await ask({ placeholder:'your name', auto:'name', max:120,
    check:(v) => v ? '' : 'just your first name is fine 🙈' });
  const first = name.split(/\s+/)[0];

  let phone = knownPhone;
  if(!phone){
    await her('cute. ' + first + ', your number? so i can text you first', 900);
    phone = digits(await ask({ type:'tel', pre:'+91', placeholder:'98XXXXXXXX', mode:'numeric', auto:'tel-national', max:14,
      check:phoneOk, show:(v) => '+91 ' + digits(v) }));
  }else{
    await her('cute. ' + first + ', i\'ll text you on that number ♡', 900);
  }

  await her('and your email? (in case my texts get lost)', 900);
  const email = await ask({ type:'email', placeholder:'you@email.com', mode:'email', auto:'email', max:200, optional:true,
    check:(v) => EMAIL.test(v.toLowerCase()) ? '' : "that doesn't look like an email 👀", show:(v) => v.toLowerCase() });

  await her('your insta? 👀', 700);
  const handle = await ask({ placeholder:'@yourhandle', auto:'username', max:60, optional:true,
    check:(v) => v.replace(/^@+/, '') ? '' : 'just the handle 🙈', show:(v) => '@' + v.replace(/^@+/, '') });

  await her("last one. what do you THINK i'm building? 🤭", 900);
  const guess = await ask({ placeholder:'your wildest guess', max:500, optional:true });

  const body = { action:'lead', name, phone, email: email ? email.toLowerCase() : null, handle, guess,
    source:trafficSource(), tz:(Intl.DateTimeFormat().resolvedOptions().timeZone || null), user_agent:navigator.userAgent };
  let r = await call(body);
  while(!r.ok){
    await her(r.rate ? 'too many people at once 😮‍💨 one sec…' : "ugh my phone's acting up — one sec", 900);
    await sleep(r.rate ? 4000 : 1500);
    r = await call(body);
  }
  ga('prebuzz_lead_submitted');
  if(r.already) await her("wait — you're already on my list 😌", 800);
  else await her("you're on the list ♡", 800);
  if(guess) await her('and that guess… 🤐 my lips are sealed', 900);
  await her("you'll hear it from me before anyone else. you heard nothing 🤫", 1000);
  const d = document.createElement('div');
  d.className = 'done';
  d.innerHTML = '<h1>you heard nothing</h1><p>but you’ll hear it from me first ♡</p>';
  add(d);
}

start();
