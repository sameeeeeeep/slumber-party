<style>
  /* THE PREBUZZ PHONE. You land on her lock screen with one unread message,
     the way the slumber page opened on an unread DM. In it she says something's
     cooking and asks if you applied for the slumber party:
       · yes — the secret slumber party group opens, and the number you applied
         with is its password. Wrong number, and you're back in her DM.
       · no  — she'll tell you before it goes live: your number and email.
     Same bubbles, fonts and wine room as /late and /checkin: the same phone. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8; --orange:#ec642a;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;
    --rowH:44px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  p{ margin:0; }
  [hidden]{ display:none !important; }
  html,body{ margin:0; height:100%; }
  body{ background:
      radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); overflow:hidden; }

  .wrap{ position:relative; max-width:520px; margin:0 auto; height:100vh; height:100dvh; overflow:hidden; }
  .screen{ position:absolute; inset:0; display:flex; flex-direction:column; }

  /* ---------------------------------------------------------- lock screen */
  #home{ padding:calc(1.4rem + env(safe-area-inset-top,0px)) 1rem 1.4rem; }
  .clock{ text-align:center; margin:1.4rem 0 1.6rem; }
  .clock b{ display:block; font-family:var(--serif); font-weight:500; font-size:4.2rem; line-height:1; letter-spacing:-.02em; }
  .clock span{ font-size:1.3rem; color:var(--soft); }
  .label{ font-size:1.1rem; letter-spacing:.14em; color:var(--soft); padding:0 .3rem .4rem; opacity:.85; }
  .notifs{ display:flex; flex-direction:column; gap:.6rem; }
  .ci-row{ display:flex; align-items:center; gap:.75rem; width:100%; text-align:left; cursor:pointer;
    color:inherit; font:inherit; padding:.8rem .9rem; border-radius:1.1rem;
    background:rgba(255,255,255,.07); border:1px solid rgba(245,195,207,.16);
    backdrop-filter:blur(10px); box-shadow:0 .5rem 1.6rem rgba(0,0,0,.35);
    opacity:0; transform:translateY(-.8rem) scale(.97);
    transition:opacity .45s ease, transform .5s cubic-bezier(.2,.85,.3,1.25), background .15s ease; }
  .ci-row.in{ opacity:1; transform:none; }
  .ci-row:hover{ background:rgba(255,255,255,.11); }
  .ci-row:focus-visible{ outline:2px solid var(--yellow); outline-offset:2px; }
  .ci-row.gold{ border-color:rgba(255,233,168,.35); background:linear-gradient(135deg,rgba(255,233,168,.12),rgba(255,255,255,.05)); }
  .ci-main{ flex:1; min-width:0; display:flex; flex-direction:column; gap:.1rem; }
  .ci-top{ display:flex; align-items:baseline; gap:.5rem; }
  .ci-name{ font-size:1.3rem; color:#fff; line-height:1.1; }
  .ci-prev{ font-size:1.25rem; color:rgba(255,246,248,.82); line-height:1.15; }
  .ci-meta{ flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:.45rem; }
  .ci-time{ font-size:1rem; color:var(--pink); }
  .gold .ci-time{ color:var(--yellow); }
  .ci-dot{ width:.6rem; height:.6rem; border-radius:100px; background:var(--pink); box-shadow:0 0 .5rem rgba(235,100,140,.85); }
  .gold .ci-dot{ background:var(--yellow); box-shadow:0 0 .5rem rgba(255,233,168,.85); }
  .ci-row.read .ci-dot{ visibility:hidden; }
  .hint{ text-align:center; font-family:var(--pixel); font-size:.55rem; letter-spacing:.06em; color:var(--soft);
    margin-top:1.1rem; opacity:0; transition:opacity .5s ease .6s; }
  .hint.in{ opacity:.8; }

  /* avatars: khushi's face, or the group's three-up stack */
  .av{ width:2.6rem; height:2.6rem; border-radius:100px; overflow:hidden; flex:none; display:grid; place-items:center;
    font-family:var(--pixel); font-size:.55rem; color:#fff; border:1px solid rgba(245,195,207,.3);
    background:linear-gradient(135deg,var(--pink),var(--orange)); }
  .av img{ width:100%; height:100%; object-fit:cover; object-position:50% 22%; display:block; }
  .stack{ position:relative; width:2.6rem; height:2.6rem; flex:none; }
  .stack .av{ position:absolute; width:1.75rem; height:1.75rem; font-size:.42rem; box-shadow:0 0 0 2px var(--wine); }
  .stack .av:nth-child(1){ left:0; top:0; }
  .stack .av:nth-child(2){ right:0; top:.2rem; background:linear-gradient(135deg,#b59bff,#7a5bd6); }
  .stack .av:nth-child(3){ left:.45rem; bottom:0; background:linear-gradient(135deg,#ffd36b,#c77a1e); }

  /* ------------------------------------------------------------- a chat */
  .conv{ transform:translateX(100%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
    background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%); }
  .conv.open{ transform:none; }
  #dm{ z-index:5; } #group{ z-index:6; }
  .conv.gold{ background:radial-gradient(120% 90% at 50% 0%, #3d2a18 0%, #2a1a14 46%, #170d0b 100%); }
  .head{ flex:none; display:flex; align-items:center; gap:.6rem; padding:calc(.8rem + env(safe-area-inset-top,0px)) .8rem .8rem;
    border-bottom:1px solid rgba(245,195,207,.14);
    background:linear-gradient(180deg,rgba(42,21,32,.96),rgba(42,21,32,.82)); backdrop-filter:blur(8px); }
  .gold .head{ background:linear-gradient(180deg,rgba(48,32,20,.96),rgba(48,32,20,.84)); border-bottom-color:rgba(255,233,168,.2); }
  .back{ flex:none; background:none; border:0; color:var(--soft); font-family:var(--mono); font-size:2.2rem; line-height:1;
    cursor:pointer; padding:0 .3rem; min-width:var(--rowH); min-height:var(--rowH); }
  .who{ min-width:0; }
  .who b{ font-size:1.3rem; font-weight:400; display:block; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .who span{ font-size:1.05rem; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
  .who span i{ color:#7ddc9b; font-style:normal; }

  .thread{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain;
    display:flex; flex-direction:column; gap:.45rem; padding:1.1rem .9rem 1.4rem; }
  .thread::-webkit-scrollbar{ width:.3rem; }
  .thread::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:1rem; }
  .msg{ max-width:84%; font-size:1.32rem; line-height:1.3; padding:.5rem .85rem; border-radius:1.15rem;
    white-space:pre-wrap; word-wrap:break-word; animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop{ from{ opacity:0; transform:translateY(.5rem) scale(.97) } to{ opacity:1; transform:none } }
  .her{ align-self:flex-start; background:var(--cream); color:var(--ink); border-bottom-left-radius:.3rem;
    box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .from{ display:block; font-size:1rem; color:var(--pink); margin-bottom:.05rem; }
  .you{ align-self:flex-end; color:#fff; background:linear-gradient(120deg,var(--pink),#d8447a);
    border-bottom-right-radius:.3rem; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  .sys{ align-self:center; text-align:center; font-size:1.05rem; color:rgba(255,246,242,.55);
    background:rgba(255,255,255,.05); border-radius:.8rem; padding:.45rem .9rem; margin:.35rem 0; }
  .sys.gold{ color:var(--yellow); background:rgba(255,233,168,.08); border:1px dashed rgba(255,233,168,.35); }
  .typing{ display:flex; gap:.28rem; align-items:center; padding:.75rem .9rem; }
  .typing i{ width:.38rem; height:.38rem; border-radius:100px; background:#b2557d; animation:blink 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.16s } .typing i:nth-child(3){ animation-delay:.32s }
  @keyframes blink{ 0%,60%,100%{ opacity:.35 } 30%{ opacity:1 } }

  .chips{ align-self:flex-end; display:flex; flex-wrap:wrap; gap:.45rem; justify-content:flex-end;
    max-width:92%; animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both; }
  .chip{ font-family:var(--mono); font-size:1.25rem; color:var(--cream); cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.4); border-radius:100px;
    min-height:var(--rowH); padding:0 1rem; }
  .chip:hover{ border-color:var(--pink); background:rgba(235,100,140,.14); }

  /* VIEW ONCE. A photo arrives as a bubble you tap, not as a picture — like
     every messenger's view-once. After it's been looked at it says so. */
  .once{ align-self:flex-start; display:flex; align-items:center; gap:.65rem; cursor:pointer;
    font-family:var(--mono); font-size:1.3rem; color:var(--ink); text-align:left;
    background:var(--cream); border:0; border-radius:1.15rem; border-bottom-left-radius:.3rem;
    padding:.6rem 1rem .6rem .7rem; box-shadow:0 2px 10px rgba(0,0,0,.25);
    animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both; }
  .once .ring{ width:2.1rem; height:2.1rem; border-radius:100px; display:grid; place-items:center; flex:none;
    border:2px dashed var(--pink); color:var(--pink); font-family:var(--pixel); font-size:.6rem; }
  .once small{ display:block; font-size:1rem; opacity:.6; }
  .once:disabled{ cursor:default; background:rgba(255,246,248,.55); }
  .once:disabled .ring{ border-style:solid; border-color:rgba(43,26,34,.35); color:rgba(43,26,34,.45); }

  /* the photo, open, inside the chat — 30 seconds, then gone */
  .viewer{ position:absolute; inset:0; z-index:20; background:#080406; display:flex; flex-direction:column;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; animation:fade .2s ease both; }
  @keyframes fade{ from{ opacity:0 } to{ opacity:1 } }
  .viewer .bar{ display:flex; align-items:center; gap:.7rem; padding:calc(.8rem + env(safe-area-inset-top,0px)) 1rem .6rem; }
  .viewer .bar span{ flex:1; font-size:1.2rem; color:var(--yellow); }
  .viewer .bar button{ font-family:var(--pixel); font-size:.55rem; color:#fff; background:none; cursor:pointer;
    border:1px solid rgba(255,255,255,.4); border-radius:100px; padding:.6rem .9rem; }
  .viewer .time{ height:3px; margin:0 1rem; border-radius:3px; background:rgba(255,255,255,.15); overflow:hidden; }
  .viewer .time i{ display:block; height:100%; width:100%; transform-origin:left;
    background:linear-gradient(90deg,var(--pink),var(--orange),var(--yellow)); }
  .viewer .pic{ flex:1; min-height:0; display:grid; place-items:center; padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px)); }
  .viewer img{ max-width:100%; max-height:100%; object-fit:contain; border-radius:.6rem; pointer-events:none; -webkit-user-drag:none; }
  .viewer .wait{ font-size:1.3rem; color:var(--soft); }

  /* THE COUPON. A ticket, not a bubble: it's the thing they came for. */
  .card{ align-self:flex-start; width:min(84%,21rem); border-radius:1rem; padding:1rem 1.1rem;
    color:var(--ink); background:linear-gradient(135deg,#fff6d6,#ffe9a8 55%,#f7cf74);
    box-shadow:0 .5rem 1.6rem rgba(0,0,0,.4), inset 0 0 0 2px rgba(255,255,255,.5);
    position:relative; animation:pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
  .card::before,.card::after{ content:''; position:absolute; top:50%; width:1.1rem; height:1.1rem;
    margin-top:-.55rem; border-radius:100px; background:#2a1a14; }
  .card::before{ left:-.55rem; } .card::after{ right:-.55rem; }
  .card small{ display:block; font-family:var(--pixel); font-size:.5rem; line-height:1.7; letter-spacing:.1em; opacity:.7; }
  .card .off{ font-family:var(--serif); font-style:italic; font-size:2rem; line-height:1.1; margin:.35rem 0 .5rem; }
  .card .code{ display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    border:2px dashed rgba(43,26,34,.45); border-radius:.6rem; padding:.45rem .7rem; }
  .card .code b{ font-family:var(--pixel); font-size:.85rem; letter-spacing:.08em; }
  .card .code button{ font-family:var(--pixel); font-size:.5rem; border:0; border-radius:100px; cursor:pointer;
    padding:.5rem .7rem; color:#fff; background:var(--ink); }
  .card .bind{ font-size:1.1rem; margin-top:.5rem; opacity:.8; }
  .card.used{ filter:grayscale(.7); opacity:.8; }

  .compose{ flex:none; padding:.7rem .9rem calc(.9rem + env(safe-area-inset-bottom,0px));
    background:#1a0f16; border-top:1px solid rgba(245,195,207,.14); }
  .gold .compose{ background:#1b120d; }
  .row{ display:flex; gap:.5rem; align-items:stretch; }
  .fld{ flex:1; min-width:0; display:flex; align-items:center; gap:.4rem; min-height:var(--rowH);
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:0 .95rem; }
  .fld:focus-within{ border-color:var(--pink); background:rgba(255,255,255,.09); }
  .fld .pre{ color:var(--soft); font-size:1.35rem; }
  .fld input{ flex:1; min-width:0; background:none; border:0; outline:0; padding:0;
    color:var(--cream); font-family:var(--mono); font-size:1.35rem; }
  input::placeholder{ color:rgba(201,160,174,.75); }
  .send{ flex:none; min-height:var(--rowH); border:0; cursor:pointer; border-radius:100px;
    padding:0 1.05rem; font-family:var(--pixel); font-size:.68rem; letter-spacing:.06em; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .send:disabled{ opacity:.62; box-shadow:none; cursor:default; }
  .skip{ flex:none; min-height:var(--rowH); background:none; border:0; color:var(--soft); cursor:pointer;
    font-family:var(--mono); font-size:1.2rem; padding:0 .4rem; }
  .err{ color:#ffb3c6; font-size:1.1rem; padding:.35rem .3rem 0; min-height:1.4rem; }

  .done{ text-align:center; padding:1.6rem 1rem 2.4rem; }
  .done h1{ font-family:var(--serif); font-style:italic; font-weight:500; font-size:2.2rem; margin:.2rem 0 .4rem; }
  .done p{ font-family:var(--hand); font-size:1.5rem; color:#ffd9e4; margin:.2rem 0 .8rem; }

  /* desktop: the phone in the middle of the room, same as /late */
  @media (min-width:800px){
    body{ display:grid; place-items:center; }
    .wrap{ width:min(30rem,100%); height:min(46rem, calc(100dvh - 3rem));
      border-radius:26px; border:1px solid rgba(245,195,207,.16); background:inherit;
      box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 100vmax rgba(10,3,8,.5); }
  }
  /* ---------------------------------------------------------- the vibe */
  /* THE GATE — the same blush screen the slumber page opened on, and for the
     same reason: one tap is the gesture that lets the phone make noise. */
  #gate{ position:fixed; inset:0; z-index:60; background:#fdeff3; display:grid; place-items:center; text-align:center;
    padding:calc(1.5rem + env(safe-area-inset-top,0px)) 1.4rem calc(1.5rem + env(safe-area-inset-bottom,0px)); }
  #gate.leaving{ animation:gateOut .6s ease forwards; pointer-events:none; }
  #gate.leaving .g-pos{ animation:gateDive .6s cubic-bezier(.5,0,.35,1) forwards; }
  .g-pos{ display:flex; flex-direction:column; align-items:center; gap:clamp(1.3rem,4.5vh,2.3rem);
    animation:gateRise .85s .1s cubic-bezier(.2,.85,.3,1) both; }
  .g-pos img{ width:min(74vw,26rem); max-height:30vh; object-fit:contain; filter:drop-shadow(0 .5rem 1.6rem rgba(235,100,140,.3)); }
  .g-ask{ font-family:var(--hand); font-weight:700; color:#d4557d; font-size:clamp(1.6rem,6.5vw,2.2rem); line-height:1.05; margin-top:-.6rem; }
  .g-ask small{ display:block; font-size:.62em; color:#eb648c; margin-top:.35rem; }
  .g-btn{ position:relative; overflow:hidden; cursor:pointer; font-family:var(--pixel); display:inline-flex; align-items:center; gap:.85em;
    font-size:.7rem; letter-spacing:.06em; color:#fff; padding:1.05em 1.6em; border-radius:.55em;
    background:linear-gradient(90deg,#eb648c,#ec642a); border:1px solid rgba(255,255,255,.5);
    box-shadow:0 0 10px rgba(235,100,140,.55), inset 0 0 8px rgba(255,255,255,.2); }
  .g-btn::after{ content:''; position:absolute; top:0; bottom:0; left:0; width:55%; pointer-events:none;
    background:linear-gradient(105deg, transparent 18%, rgba(255,255,255,.6) 50%, transparent 82%);
    animation:shimmer 2.6s ease-in-out infinite; }
  .g-btn:hover{ transform:translateY(-2px); }
  .g-small{ position:absolute; left:0; right:0; bottom:calc(1.1rem + env(safe-area-inset-bottom,0px));
    font-size:1.02rem; color:#eb648c; }
  .g-small a{ color:inherit; }
  @keyframes shimmer{ 0%{ transform:translateX(-200%) skewX(-14deg); } 55%,100%{ transform:translateX(320%) skewX(-14deg); } }
  @keyframes gateOut{ to{ opacity:0 } }
  @keyframes gateRise{ from{ opacity:0; transform:translateY(16px) scale(.94) } to{ opacity:1; transform:none } }
  @keyframes gateDive{ to{ opacity:0; transform:scale(1.6); filter:blur(7px) } }

  /* the phone buzzes when a notification lands */
  .ci-row.buzz{ animation:buzz .5s linear; }
  @keyframes buzz{ 0%,100%{ translate:0 } 10%,50%,90%{ translate:-3px 0 } 30%,70%{ translate:3px 0 } }
  .wrap.buzz{ animation:buzz .45s linear; }

  /* CRT scanlines over the whole phone — the slumber page's TV, turned way down */
  .wrap::after{ content:''; position:absolute; inset:0; z-index:40; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply; opacity:.55; }

  /* sound on/off, top-right of the lock screen */
  .snd{ position:absolute; right:.9rem; top:calc(.9rem + env(safe-area-inset-top,0px)); z-index:2;
    width:var(--rowH); height:var(--rowH); border-radius:100px; cursor:pointer; font-size:1.3rem; color:var(--cream);
    background:rgba(255,255,255,.08); border:1px solid rgba(245,195,207,.25); }
  .snd.off{ opacity:.45; text-decoration:line-through; }

  /* the shutter flash when a view-once photo opens */
  .viewer .flash{ position:absolute; inset:0; background:#fff; pointer-events:none; animation:flash .45s ease-out forwards; }
  @keyframes flash{ from{ opacity:.9 } to{ opacity:0 } }


  @media (prefers-reduced-motion:reduce){
    .ci-row.buzz,.wrap.buzz,.g-pos,.g-btn::after{ animation:none; }
    .msg,.card,.chips,.once,.viewer{ animation:none; }
    .conv,.ci-row{ transition:none; }
  }
</style>
</head>
<body>
<!-- the gate: one tap lets the phone make noise -->
<div id="gate">
  <div class="g-pos">
    <img src="/assets/logo2.png" alt="khushi's secret slumber party" />
    <p class="g-ask">psst… you've got messages<small>sound on 🔊</small></p>
    <button class="g-btn" type="button" id="enter"><span>enter</span><i aria-hidden="true">▸</i></button>
  </div>
  <p class="g-small">by entering you accept our <a href="/terms.html" target="_blank" rel="noopener">T&amp;C</a></p>
</div>
<div class="wrap" id="phone">

  <!-- the lock screen: two unread messages -->
  <section class="screen" id="home">
    <button class="snd" type="button" id="snd" aria-label="sound on/off">♪</button>
    <div class="clock"><b id="clockT">9:41</b><span id="clockD">today</span></div>
    <p class="label">notifications</p>
    <div class="notifs">
      <button class="ci-row" type="button" id="rowDm">
        <span class="av"><img src="/assets/khushi-face.png" alt="" /></span>
        <span class="ci-main">
          <span class="ci-top"><span class="ci-name">khushi</span></span>

<script src="/assets/config.js?v=2026-10-27-prebuzz"></script>
<script>
/* ============================================================================
   /kk — khushi's prebuzz phone.

   Everything a stranger can see is in this file. Everything only a slumber
   applicant may see — the group's lines, the photos, the coupon — is NOT: it
   arrives from /functions/v1/prebuzz after the phone they type has matched a
   row in `applications`. View-source shows the shape of the group and none of
   its contents. The copy is edited in public.prebuzz_settings (see the
   migration 20261027120000_prebuzz.sql).
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const API = (CFG.prebuzzUrl || (CFG.supabaseUrl || '').replace(/\/$/,'') + '/functions/v1/prebuzz');
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const TOKEN_KEY = 'ssp-pb';
const PHOTO_SECONDS = 30;

function visitorId(){ try{ return localStorage.getItem('ssp-vid') || null; }catch(e){ return null; } }
function trafficSource(){
  const ua = navigator.userAgent;
  if(/Instagram/i.test(ua)) return 'instagram';
  if(/FBAN|FBAV|FB_IAB/i.test(ua)) return 'facebook';
  if(/Barcelona/i.test(ua)) return 'threads';
  if(/Snapchat/i.test(ua)) return 'snapchat';
  try{
    const q = new URLSearchParams(location.search);
    const src = q.get('src') || q.get('utm_source');
    if(src) return src.slice(0,40);
  }catch(e){}
  if(document.referrer){ try{ return new URL(document.referrer).hostname; }catch(e){} }
  return 'direct';
}
function ga(name, params){
  try{ if(window.gtag && window.ga4Ready && window.ga4Ready()) gtag('event', name, Object.assign({ ssp_vid:visitorId() }, params||{})); }catch(e){}
}
function token(v){
  try{ if(v === undefined) return localStorage.getItem(TOKEN_KEY); if(v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY); }catch(e){ return null; }
}

/* ---- sound — all synthesized, no files ----------------------------------------
   The slumber page's chat sounds (nokia sms tone, the two-note ding, the send
   swoosh, key ticks) plus a few for here: the phone buzz, the group-join chime,
   a camera shutter, and the soft poof of a view-once photo going. Lazy context,
   woken by every gesture (iOS re-suspends it when idle); every sound is
   try/catch'd so audio can never break the page. Shares 'ksp-snd' with / . */
const FX = (function(){
  let ctx = null, noise = null;
  let muted = false; try{ muted = localStorage.getItem('ksp-snd') === 'off'; }catch(e){}
  function unlock(){
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state !== 'running') ctx.resume();
      const b = ctx.createBuffer(1, 1, 22050), src = ctx.createBufferSource(); src.buffer = b; src.connect(ctx.destination); src.start(0);
    }catch(e){}
  }
  ['pointerdown','touchstart','touchend','keydown','click'].forEach(ev => window.addEventListener(ev, unlock, { passive:true }));
  const ok = () => !muted && ctx && ctx.state === 'running';
  function noiseBuf(){
    if(!noise){ noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = noise.getChannelData(0); for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    return noise;
  }
  function tone(freq, at, dur, type, peak){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, at); o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    o.start(at); o.stop(at + dur + 0.02);
  }
  function hiss(at, dur, type, from, to, peak, q){
    const src = ctx.createBufferSource(); src.buffer = noiseBuf();
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(from, at); f.frequency.exponentialRampToValueAtTime(to, at + dur);
    const g = ctx.createGain(); src.connect(f); f.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
    src.start(at); src.stop(at + dur + 0.02);
  }
  const play = (fn) => { try{ if(ok()) fn(ctx.currentTime + 0.01); }catch(e){} };
  return {
    unlock,
    muted: () => muted,
    setMuted(m){ muted = !!m; try{ localStorage.setItem('ksp-snd', muted ? 'off' : 'on'); }catch(e){} if(!muted) unlock(); },
    // the classic nokia sms tone — morse for "sms"
    nokia: () => play(t => {
      const DOT = .07, DASH = .2, GAP = .07, LGAP = .2, F = 2093, P = .05;
      [DOT,DOT,DOT].forEach(d => { tone(F, t, d, 'square', P); t += d + GAP; }); t += LGAP - GAP;
      [DASH,DASH].forEach(d => { tone(F, t, d, 'square', P); t += d + GAP; }); t += LGAP - GAP;
      [DOT,DOT,DOT].forEach(d => { tone(F, t, d, 'square', P); t += d + GAP; });
    }),
    // the phone buzzing on the table: a low rattle
    buzz: () => play(t => { for(let i = 0; i < 2; i++){ tone(140, t + i * .22, .16, 'sawtooth', .05); hiss(t + i * .22, .16, 'lowpass', 400, 200, .05); } }),
    recv: () => play(t => { tone(784, t, .16, 'triangle', .07); tone(1046.5, t + .12, .22, 'sine', .06); }),
    sent: () => play(t => { hiss(t, .28, 'bandpass', 400, 3500, .08, 6); }),
    click: () => play(t => { hiss(t, .012, 'highpass', 2500 + Math.random() * 1500, 3000, .03); }),
    // the group lets you in / the coupon lands: a sparkly arpeggio up
    chime: () => play(t => { [1046.5, 1318.5, 1568, 2093].forEach((f, i) => tone(f, t + i * .08, .5, 'sine', .05)); }),
    shutter: () => play(t => { hiss(t, .05, 'highpass', 1800, 1800, .14); hiss(t + .09, .08, 'bandpass', 1200, 900, .1, 2); }),
    poof: () => play(t => { hiss(t, .45, 'lowpass', 2400, 180, .06); tone(660, t, .3, 'sine', .03); }),
  };
})();

/* ---- the server ----------------------------------------------------------- */
async function call(body, attempt = 0){
  if(!CFG.supabaseAnonKey) return { ok:false };
  try{
    const r = await fetch(API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey, Authorization:'Bearer ' + CFG.supabaseAnonKey },
      body: JSON.stringify(Object.assign({ visitor_id:visitorId() }, body)),
    });
    if(r.status === 429) return { ok:false, rate:true };
    if(r.status === 401) return { ok:false, session:true };
    if(r.status >= 500 && attempt === 0){ await sleep(900); return call(body, 1); }
    const j = await r.json().catch(() => ({}));
    return r.ok ? j : Object.assign({ ok:false }, j);
  }catch(e){
    if(attempt === 0){ await sleep(900); return call(body, 1); }
    return { ok:false };
  }
}

/* ============================================================================
   A CONVERSATION — one per chat, each with its own thread and compose row,
   so leaving one mid-question and coming back finds it where you left it
   ========================================================================== */
function Conv(id){
  const el = document.getElementById(id);
  const thread = el.querySelector('.thread'), compose = el.querySelector('.compose');
  const answer = el.querySelector('.answer'), err = el.querySelector('.err');
  const c = { el, thread, started:false };

  const keepUp = () => thread.scrollTo({ top: thread.scrollHeight, behavior:'smooth' });
  c.add = (node) => { thread.appendChild(node); keepUp(); return node; };
  c.bubble = (cls, text, from) => {
    if(cls === 'you') FX.sent(); else if(cls === 'her') FX.recv();
    const p = document.createElement('p');
    p.className = 'msg ' + cls;
    if(from){ const s = document.createElement('span'); s.className = 'from'; s.textContent = from; p.appendChild(s); }
    p.appendChild(document.createTextNode(text));
    return c.add(p);
  };
  c.sys = (text, cls) => {
    const p = document.createElement('p');
    p.className = 'sys' + (cls ? ' ' + cls : ''); p.textContent = text;
    return c.add(p);
  };
  c.her = async (text, beat, from) => {
    const t = document.createElement('div');
    t.className = 'msg her typing'; t.innerHTML = '<i></i><i></i><i></i>';
    c.add(t); await sleep(beat || Math.min(1400, 450 + String(text).length * 14)); t.remove();
    return c.bubble('her', text, from);
  };
  c.chips = (options) => new Promise(resolve => {
    const d = document.createElement('div'); d.className = 'chips';
    options.forEach(o => {
      const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = o.label;
      b.onclick = () => { d.remove(); c.bubble('you', o.label); resolve(o.value); };
      d.appendChild(b);
    });
    c.add(d);
  });
  /* one text question. check(value) returns an error string or '' and may be async */
  c.ask = ({ type = 'text', placeholder = '', pre = '', mode, auto, optional = false, max = 120, check, show }) =>
    new Promise(resolve => {
      compose.hidden = false; err.textContent = '';
      answer.innerHTML =
        '<form class="row" novalidate>' +
          '<span class="fld">' + (pre ? '<span class="pre">' + pre + '</span>' : '') +
            '<input type="' + type + '" maxlength="' + max + '" /></span>' +
          (optional ? '<button class="skip" type="button">skip</button>' : '') +
          '<button class="send" type="submit">SEND ▸</button>' +
        '</form>';
      const f = answer.querySelector('form'), inp = answer.querySelector('input');
      inp.placeholder = placeholder;
      if(mode) inp.inputMode = mode;
      if(auto) inp.autocomplete = auto;
      inp.addEventListener('keydown', (e) => { if(e.key.length === 1 || e.key === 'Backspace') FX.click(); });
      // the compose row just took space from the thread: jump to the newest line
      // (instantly — a smooth scroll gets cut short by the resize)
      requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; inp.focus({ preventScroll:true }); });
      const done = (v, echo) => { compose.hidden = true; answer.innerHTML = ''; if(echo) c.bubble('you', echo); resolve(v); };
      if(optional) answer.querySelector('.skip').onclick = () => done(null, 'skip');
      f.addEventListener('submit', async (e) => {
        e.preventDefault();
        const send = f.querySelector('.send'); if(send.disabled) return;
        const v = inp.value.trim();
        send.disabled = true;
        const bad = check ? await check(v) : (v ? '' : 'say something 🙈');
        send.disabled = false;
        if(bad){ err.textContent = bad; return; }
        done(v, show ? show(v) : v);
      });
    });
  return c;
}

/* ============================================================================
   THE SECRET SLUMBER PARTY — locked; the number you applied with opens it.
   Resolves {member:true} once you're in, or {member:false, phone} if not.
   ========================================================================== */
async function groupFlow(){
  group.sys('🔒 this group is locked', 'gold');
  await sleep(300);
  await group.her('only for the ones who were there from the start 🎀', 900);
  await group.her('the password is the number you applied with 👇', 1000);

  let res, typed;
  await group.ask({ type:'tel', pre:'+91', placeholder:'98XXXXXXXX', mode:'numeric', auto:'tel-national', max:14,
    show:(v) => '+91 ' + digits(v),
    check: async (v) => {
      const bad = phoneOk(v); if(bad) return bad;
      typed = digits(v);
      res = await call({ action:'check', phone:typed });
      if(res.rate) return 'too many tries — give it a little while 🙏';
      if(!res.ok) return "ugh, my phone's acting up. try again?";
      return '';
    } });

  if(res.member){
    token(res.token);
    ga('prebuzz_member_unlocked');
    inside(res.chat, false, typed);
    return { member:true };
  }
  ga('prebuzz_member_miss');
  group.sys('wrong password 🔒', 'gold');
  return { member:false, phone:typed };
}

/* inside the group — everything in `chat` came from the server */
async function inside(chat, returning, phone){
  document.getElementById('groupSub').textContent = 'khushi + you + the ones from the start';
  if(returning){
    group.sys('welcome back to the secret slumber party 🔒', 'gold');
    await group.her('you again 😌 your stuff is right where you left it', 800);
  }else{
    group.sys('you’re in 🔒 welcome to the secret slumber party', 'gold');

  }

  // the photos, one at a time: the next arrives once you've opened this one
  const photos = chat.photos || [];
  for(let i = 0; i < photos.length; i++){
    if(!returning && chat.photo_lines && chat.photo_lines[i]) await group.her(chat.photo_lines[i]);
    await viewOnce(i, photos[i].viewed);
  }
  if(!returning) await say(chat.after_lines);

  if(chat.coupon){
    if(!returning && chat.coupon_line) await group.her(chat.coupon_line, 1300);

/* her lines from the server: plain strings or {from, text} */
async function say(lines){

    const line = typeof l === 'string' ? { text:l } : l;
    if(line && line.text) await group.her(line.text, null, line.from && line.from !== 'khushi' ? line.from : null);

/* a view-once photo bubble. Resolves once it's been looked at (or already was). */
function viewOnce(i, viewed){
  return new Promise(resolve => {
    const b = document.createElement('button');
    b.className = 'once'; b.type = 'button';
    b.innerHTML = '<span class="ring">1</span><span>photo<small></small></span>';
    const sub = b.querySelector('small');
    const opened = () => { b.disabled = true; b.querySelector('.ring').textContent = '✓'; sub.textContent = 'opened'; };
    if(viewed){ opened(); group.add(b); return resolve(); }
    sub.textContent = 'view once · tap to open';
    b.onclick = async () => {
      b.disabled = true; sub.textContent = 'opening…';
      const r = await call({ action:'photo', token:token(), idx:i });
      if(r.ok && r.url){ ga('prebuzz_photo_opened', { idx:i }); await showPhoto(r.url); opened(); return resolve(); }
      if(r.ok && r.seen){ opened(); return resolve(); }
      if(r.session){ token(null); sub.textContent = 'chat timed out — reload and type your number again'; return; }
      b.disabled = false; sub.textContent = "didn't load — tap to try again";
    };
    group.add(b);
  });
}

/* opens over the group chat itself — not a new tab — and closes on its own
   after PHOTO_SECONDS. The image leaves the page when it does. */
function showPhoto(url){
  return new Promise(resolve => {
    const v = document.createElement('div');
    v.className = 'viewer';
    v.innerHTML = '<div class="bar"><span>view once · <b class="left">' + PHOTO_SECONDS + '</b>s</span><button type="button">CLOSE</button></div>' +
      '<div class="time"><i></i></div><div class="pic"><p class="wait">loading…</p></div>';
    v.addEventListener('contextmenu', e => e.preventDefault());
    const img = new Image(); img.alt = ''; img.draggable = false;
    const bar = v.querySelector('.time i'), left = v.querySelector('.left');
    let timer = null, t0 = 0, closed = false;
    const finish = () => {
      if(closed) return; closed = true;
      clearInterval(timer); img.src = ''; v.remove(); FX.poof(); resolve();
    };
    img.onload = () => {
      v.querySelector('.pic').replaceChildren(img);
      FX.shutter();
      const fl = document.createElement('div'); fl.className = 'flash'; v.appendChild(fl); setTimeout(() => fl.remove(), 500);
      t0 = Date.now();
      timer = setInterval(() => {
        const rem = Math.max(0, PHOTO_SECONDS - (Date.now() - t0) / 1000);
        left.textContent = Math.ceil(rem);
        bar.style.transform = 'scaleX(' + (rem / PHOTO_SECONDS) + ')';
        if(rem <= 0) finish();
      }, 200);
    };
    img.onerror = finish;
    img.src = url;
    v.querySelector('button').onclick = finish;
    group.el.appendChild(v);
  });
}

  const v = await group.ask({ type:'url', placeholder:'instagram.com/p/…', mode:'url', max:400, optional:true,
    check: async (raw) => {
      const url = /^https?:\/\//i.test(raw) ? raw : 'https://' + raw;
      const r = await call({ action:'hamper', token:token(), url });
      if(r.ok) return '';
      if(r.error === 'url') return 'paste the link to your post (instagram, threads, x…) 🔗';
      if(r.session){ token(null); return 'your chat timed out — reload and type your number again'; }
      return "ugh, didn't go through. try again?";
    } });
  if(v === null) return group.her('no stress — come back anytime ♡', 800);
  ga('prebuzz_hamper_entered');
  await group.her("you're in the draw 🎀 i'll pick a few of you myself", 900);
}

/* ---- the lock screen ------------------------------------------------------- */
function stampNow(){
  const d = new Date(), h = d.getHours(), m = d.getMinutes();
  return 'today · ' + (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm');
}
function buzz(row){
  FX.buzz();
  try{ if(navigator.vibrate) navigator.vibrate([90, 60, 90]); }catch(e){}
  row.classList.add('in'); row.classList.remove('buzz'); void row.offsetWidth; row.classList.add('buzz');
}
async function boot(){
  const d = new Date();
  document.getElementById('clockT').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
  document.getElementById('clockD').textContent = d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' }).toLowerCase();
  // her message lands with a buzz and the nokia tone
  await sleep(700); buzz(rowDm); FX.nokia();
  document.getElementById('hint').classList.add('in');
}
const snd = document.getElementById('snd');
const paintSnd = () => { snd.classList.toggle('off', FX.muted()); snd.title = FX.muted() ? 'sound off' : 'sound on'; };
snd.onclick = () => { FX.setMuted(!FX.muted()); paintSnd(); };
paintSnd();
ga('prebuzz_landed', { source:trafficSource() });
document.getElementById('enter').addEventListener('click', () => {
  FX.unlock(); FX.setMuted(false); paintSnd();   // entering is the gesture that turns sound on, as on /
  ga('prebuzz_entered');
  const g = document.getElementById('gate'); g.classList.add('leaving');
  setTimeout(() => { g.remove(); boot(); }, 560);
}, { once:true });
</script>
