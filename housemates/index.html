<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>housemates 🤫 · khushi's slumber party</title>
<meta name="description" content="Introductions." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* HOUSEMATES — the introduction round.
     This one is a PRESENTATION, not a game: it's driven live in a room while
     forty people meet each other. So everything is built for being read from a
     few feet away and advanced without looking down — one enormous NEXT, big
     type, and a card that fills a phone. The walking is there because it makes
     the round feel like a room rather than a slideshow. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  p,h1,h2{ margin:0; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:var(--wine-2); color:var(--cream); font-family:var(--mono);
    touch-action:none; user-select:none; -webkit-user-select:none; }

  /* ---- the word ---- */
  #gate{ position:fixed; inset:0; display:grid; place-items:center; padding:1.4rem; z-index:30;
    background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%); }
  .gbox{ text-align:center; width:min(22rem,100%); }
  .gbox img{ display:block; width:min(74%,15rem); margin:0 auto .8rem; }
  .gbox h1{ font-family:var(--serif); font-style:italic; font-size:1.7rem; margin:0 0 1.1rem; color:#fff; }
  .gbox form{ display:flex; gap:.5rem; }
  .gbox input{ flex:1; min-width:0; background:rgba(255,255,255,.06);
    border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:.6rem 1rem;
    color:var(--cream); font-family:var(--mono); font-size:1.3rem; outline:none; text-align:center; }
  .gbox input:focus{ border-color:var(--pink); }
  .gbox button{ flex:none; border:0; cursor:pointer; border-radius:100px; padding:.55rem 1.05rem;
    font-family:var(--pixel); font-size:.6rem; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .gbox .err{ min-height:1.5rem; margin-top:.7rem; font-size:1.1rem; color:#ffb3c6; }
  .gbox.no input{ animation:no .35s; }
  @keyframes no{ 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

  /* ---- the room ---- */
  #room{ position:fixed; inset:0; display:none; }
  #room.on{ display:block; }
  canvas{ display:block; width:100%; height:100%; }

  #count{ position:fixed; top:calc(.7rem + env(safe-area-inset-top,0px)); left:0; right:0;
    text-align:center; font-family:var(--pixel); font-size:.62rem; letter-spacing:.14em;
    color:var(--yellow); text-shadow:0 0 10px rgba(255,233,168,.5); pointer-events:none; z-index:6; }

  /* ---- the card. Big on purpose: it's read across a table. ---- */
  #card{ position:fixed; left:50%; transform:translateX(-50%) translateY(12px);
    bottom:calc(6.4rem + env(safe-area-inset-bottom,0px));
    width:min(30rem,calc(100vw - 1.6rem)); background:var(--cream); color:var(--ink);
    border-radius:1.3rem; padding:1rem 1.1rem; box-shadow:0 18px 50px rgba(0,0,0,.55);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:8;
    display:flex; gap:.9rem; align-items:flex-start; }
  #card.on{ opacity:1; transform:translateX(-50%) translateY(0); }
  #card .art{ flex:none; width:5.6rem; height:5.6rem; border-radius:1rem; overflow:hidden;
    background:#f0dbe4; display:grid; place-items:center; }
  #card .art img{ width:100%; height:100%; object-fit:cover; display:block; }
  /* contain, not cover: the drawn character is a fixed square and the slot changes
     shape between phone and desktop — covering cropped the head off. Uploaded art
     still covers, because a photo should fill its frame. */
  #card .art canvas{ width:100%; height:100%; object-fit:contain; display:block; }
  #card .txt{ min-width:0; }
  #card .nm{ font-size:1.85rem; line-height:1.05; }
  #card .tr{ display:inline-block; font-family:var(--pixel); font-size:.5rem; letter-spacing:.08em;
    border:1px solid rgba(43,26,34,.3); border-radius:100px; padding:.2rem .42rem; margin-left:.4rem;
    vertical-align:middle; color:var(--rose); }
  #card .in{ font-size:1.3rem; line-height:1.32; color:rgba(43,26,34,.78); margin-top:.3rem;
    white-space:pre-wrap; }
  #card a{ display:inline-block; margin-top:.4rem; color:var(--rose); font-size:1.2rem;
    text-decoration:underline; text-underline-offset:2px; }
  @media (max-width:520px){
    #card{ flex-direction:column; align-items:stretch; }
    #card .art{ width:100%; height:9rem; }
    #card .nm{ font-size:1.7rem; }
  }

  /* ---- driving the round ---- */
  #bar{ position:fixed; left:0; right:0; bottom:calc(1rem + env(safe-area-inset-bottom,0px));
    display:flex; gap:.6rem; justify-content:center; align-items:center; z-index:9; padding:0 .8rem; }
  #bar button{ border:0; cursor:pointer; border-radius:100px; color:#fff;
    font-family:var(--pixel); letter-spacing:.06em; box-shadow:0 .3rem 1rem rgba(0,0,0,.4); }
  #prev, #next{ background:linear-gradient(120deg,var(--pink),#d8447a); font-size:.72rem;
    padding:1rem 1.3rem; }
  #next{ background:linear-gradient(120deg,var(--pink),#e2703f); flex:1; max-width:16rem;
    font-size:.86rem; padding:1.15rem 1.3rem; }
  #bar button:disabled{ opacity:.35; box-shadow:none; cursor:default; }
  #hint{ position:fixed; bottom:calc(5.1rem + env(safe-area-inset-bottom,0px)); left:0; right:0;
    text-align:center; font-size:1rem; color:var(--soft); pointer-events:none; z-index:6;
    transition:opacity .4s; }
</style>
</head>
<body>

<div id="gate">
  <div class="gbox" id="gbox">
    <img src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <h1>housemates</h1>
    <form id="gform">
      <input id="gpw" type="password" autocomplete="off" autocapitalize="none" placeholder="•••••" />
      <button type="submit">OPEN ▸</button>
    </form>
    <p class="err" id="gerr"></p>
  </div>
</div>

<div id="room">
  <canvas id="cv"></canvas>
  <p id="count"></p>
  <div id="card"></div>
  <p id="hint"></p>
  <div id="bar">
    <button id="prev" type="button">◂</button>
    <button id="next" type="button">NEXT ▸</button>
  </div>
</div>

<script src="/assets/config.js"></script>
<script type="module">
/* ============================================================================
   HOUSEMATES — walk the round table, one introduction at a time.

   Everyone sits along a shallow arc, in a fixed order the endpoint decides, so
   the round is the same every time it's opened. NEXT glides the host's character
   to the next seat and opens that person's card; you can also just walk. The
   glide is the point: it reads as going round the table rather than paging
   through a deck.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
const TOUCH = matchMedia('(hover:none) and (pointer:coarse)').matches;

const LOOKS = [
  { hair:'#3a2418', skin:'#f0c9a8', pj:'#eb648c' },
  { hair:'#1d1420', skin:'#e3b088', pj:'#8fd7ff' },
  { hair:'#7a4a2a', skin:'#f7dcc0', pj:'#ffe08a' },
  { hair:'#2b1a22', skin:'#c98d63', pj:'#a6f0c0' },
  { hair:'#4b2e5a', skin:'#f0c9a8', pj:'#eb9cff' },
  { hair:'#12100f', skin:'#8d5a3b', pj:'#ffc48a' },
  { hair:'#8a5a3c', skin:'#e8bd97', pj:'#9ab0ff' },
  { hair:'#241a2e', skin:'#d79c72', pj:'#ff9ab0' },
];

function rrOn(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r); g.closePath();
}
/* Same character routine as the house, so a guest looks like themselves in both. */
function drawPersonOn(g, px, py, s, look, facing, walkT, label, glow){
  const L = LOOKS[look % LOOKS.length];
  const y = py + Math.sin(walkT * 0.018) * s * 0.05;
  g.fillStyle = 'rgba(0,0,0,.3)';
  g.beginPath(); g.ellipse(px, py + s * 0.46, s * 0.3, s * 0.11, 0, 0, 7); g.fill();
  if (glow){
    g.save(); g.shadowColor = '#ffd84a'; g.shadowBlur = s * 0.7;
    g.fillStyle = 'rgba(255,216,74,.22)';
    g.beginPath(); g.arc(px, y + s * 0.06, s * 0.44, 0, 7); g.fill(); g.restore();
  }
  g.fillStyle = L.pj;
  rrOn(g, px - s * 0.24, y - s * 0.06, s * 0.48, s * 0.5, s * 0.14); g.fill();
  const step = Math.sin(walkT * 0.02) * s * 0.08;
  g.fillRect(px - s * 0.17, y + s * 0.38, s * 0.13, s * 0.12 + step);
  g.fillRect(px + s * 0.04, y + s * 0.38, s * 0.13, s * 0.12 - step);
  g.fillStyle = L.skin;
  g.beginPath(); g.arc(px, y - s * 0.24, s * 0.22, 0, 7); g.fill();
  g.fillStyle = L.hair;
  g.beginPath(); g.arc(px, y - s * 0.28, s * 0.23, Math.PI * 0.98, Math.PI * 2.02); g.fill();
  if (facing !== 'up'){
    g.fillStyle = '#2b1a22';
    const ex = facing === 'left' ? -s * 0.07 : facing === 'right' ? s * 0.07 : 0;
    g.beginPath();
    g.arc(px + ex - s * 0.07, y - s * 0.22, s * 0.028, 0, 7);
    g.arc(px + ex + s * 0.07, y - s * 0.22, s * 0.028, 0, 7);
    g.fill();
  }
  if (label){
    g.font = '600 ' + Math.max(10, s * 0.24) + 'px ui-monospace, monospace';
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(26,10,18,.8)';
    const w = g.measureText(label).width + s * 0.22;
    rrOn(g, px - w / 2, y - s * 0.8, w, s * 0.3, s * 0.1); g.fill();
    g.fillStyle = '#ffe9a8';
    g.fillText(label, px, y - s * 0.59);
  }
}

/* ---------- the round ---------- */
const SEAT = 130;                    // world units between seats
let PEOPLE = [], host = { x:0, walkT:0 }, at = -1, target = null,
    PW = null, arts = new Map();
try { PW = sessionStorage.getItem('ssp-housemates'); } catch(e){}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* Seats sit on a shallow arc so the line reads as the edge of a table rather
   than a queue: same order, but it curves away from you at both ends. */
const seatX = i => i * SEAT;
const seatY = i => {
  const mid = (PEOPLE.length - 1) / 2 || 1;
  const t = (i - mid) / mid;
  return -Math.cos(t * 1.15) * SEAT * 0.55;
};

async function fetchPeople(pw){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'') + '/functions/v1/housemates', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey,
              Authorization:'Bearer ' + CFG.supabaseAnonKey },
    body: JSON.stringify({ password: pw })
  });
  if (r.status === 401) return { wrong:true };
  if (r.status === 429) return { rate:true };
  const j = await r.json().catch(() => ({}));
  return j.ok ? j : {};
}

async function enter(pw, quiet){
  const res = await fetchPeople(pw);
  if (res.people && res.people.length){
    PW = pw;
    try { sessionStorage.setItem('ssp-housemates', pw); } catch(e){}
    PEOPLE = res.people;
    for (const p of PEOPLE) if (p.art){ const im = new Image(); im.src = p.art; arts.set(p.name, im); }
    document.getElementById('gate').style.display = 'none';
    document.getElementById('room').classList.add('on');
    hint(TOUCH ? 'tap NEXT to go round · or drag to walk'
               : 'NEXT or → to go round · ← to go back');
    host.x = seatX(0) - SEAT * 0.9;
    resize(); goTo(0);
    if (!raf) loop();
    return true;
  }
  if (!quiet){
    const box = document.getElementById('gbox');
    document.getElementById('gerr').textContent =
      res.rate ? 'too many tries — give it a while 🙏' : res.wrong ? "that's not it 👀" : 'hmm, try again';
    box.classList.remove('no'); void box.offsetWidth; box.classList.add('no');
  }
  return false;
}

/* ---------- driving ---------- */
let cardT = 0;
function goTo(i){
  if (!PEOPLE.length) return;
  at = Math.max(0, Math.min(PEOPLE.length - 1, i));
  target = seatX(at);                       // the walk eases there
  /* The card is on a timer, NOT on the render loop. This gets driven live in front
     of a room: if rendering stutters — a backgrounded tab, an in-app browser
     starving requestAnimationFrame — the introduction still has to appear the
     moment it's asked for. The walk is decoration; the card is the point. */
  paintCard(null);
  clearTimeout(cardT);
  cardT = setTimeout(() => paintCard(PEOPLE[at]), 430);
  paintCount();
  document.getElementById('prev').disabled = at <= 0;
  document.getElementById('next').disabled = at >= PEOPLE.length - 1;
}
document.getElementById('next').addEventListener('click', () => goTo(at + 1));
document.getElementById('prev').addEventListener('click', () => goTo(at - 1));
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); goTo(at + 1); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); goTo(at - 1); }
});
/* drag anywhere to scrub along the table — for a phone held in one hand */
(function drag(){
  let down = false, sx = 0, hx = 0;
  const start = e => { down = true; sx = (e.touches ? e.touches[0] : e).clientX; hx = host.x; target = null; };
  const move = e => {
    if (!down) return;
    const x = (e.touches ? e.touches[0] : e).clientX;
    host.x = hx - (x - sx) / view.s;
    host.walkT += 6;
    const near = Math.round(host.x / SEAT);
    if (near !== at && near >= 0 && near < PEOPLE.length){ at = near; paintCount(); }
  };
  const end = () => { down = false; if (at >= 0) goTo(at); };
  cv.addEventListener('touchstart', start, { passive:true });
  cv.addEventListener('touchmove', move, { passive:true });
  cv.addEventListener('touchend', end);
  cv.addEventListener('pointerdown', start);
  addEventListener('pointermove', move);
  addEventListener('pointerup', end);
})();

function paintCount(){
  document.getElementById('count').textContent =
    PEOPLE.length ? (at + 1) + ' / ' + PEOPLE.length : '';
}

function paintCard(p){
  const el = document.getElementById('card');
  if (!p){ el.classList.remove('on'); return; }
  const tier = p.tier === 'super' ? 'SUPER GUEST' : String(p.tier || '').toUpperCase();
  const ig = p.instagram
    ? `<a href="https://instagram.com/${encodeURIComponent(p.instagram)}" target="_blank" rel="noopener">@${esc(p.instagram)} ↗</a>`
    : '';
  el.innerHTML =
    `<div class="art" id="cardArt"></div>` +
    `<div class="txt"><p class="nm">${esc(p.name)}<span class="tr">${esc(tier)}</span></p>` +
    `<p class="in">${esc(p.intro || 'one of the thirty-five 🤫')}</p>${ig}</div>`;
  const slot = el.querySelector('#cardArt');
  if (p.art){
    const im = document.createElement('img');
    im.src = p.art; im.alt = p.name;
    /* If the artwork fails, fall back to their drawn character rather than an
       empty box — this is on screen in front of the person it describes. */
    im.onerror = () => { slot.innerHTML = ''; slot.appendChild(portrait(p)); };
    slot.appendChild(im);
  } else {
    slot.appendChild(portrait(p));
  }
  el.classList.add('on');
}
function portrait(p){
  const c = document.createElement('canvas');
  c.width = 200; c.height = 200;
  drawPersonOn(c.getContext('2d'), 100, 118, 150, p.sprite, 'down', 0, '');
  return c;
}

let hintT = 0;
function hint(t){
  const el = document.getElementById('hint');
  el.textContent = t; el.style.opacity = '1';
  clearTimeout(hintT); hintT = setTimeout(() => el.style.opacity = '0', 6000);
}

/* ---------- camera ---------- */
let view = { s:1 }, raf = 0;
function resize(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // one seat plus its neighbours should always be visible, on any screen
  view.s = Math.max(0.5, Math.min(1.5, innerWidth / (SEAT * 3.6)));
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------- loop ---------- */
let last = 0, lastFrameAt = 0;
function frame(now){
  const t = now || performance.now();
  const dt = Math.min(50, last ? t - last : 16); last = t; lastFrameAt = Date.now();
  if (target !== null){
    const d = target - host.x;
    if (Math.abs(d) < 1.2){ host.x = target; target = null; }
    else { host.x += d * Math.min(1, dt / 190); host.walkT += dt * 2.4; }
  }
  draw();
}
function loop(t){ raf = requestAnimationFrame(loop); frame(t); }
/* the same watchdog the house uses: in-app browsers starve rAF */
setInterval(() => {
  if (!PEOPLE.length || document.hidden) { if (document.hidden) last = 0; return; }
  if (Date.now() - lastFrameAt > 250) frame();
}, 120);

function draw(){
  const W = innerWidth, H = innerHeight, s = view.s;
  cx.fillStyle = '#1c1017'; cx.fillRect(0, 0, W, H);
  // the table: a soft band the seats sit against
  const cyw = H * 0.62;
  const grd = cx.createLinearGradient(0, cyw - H * 0.3, 0, H);
  grd.addColorStop(0, '#3b2340'); grd.addColorStop(1, '#2a1520');
  cx.fillStyle = grd; cx.fillRect(0, cyw - H * 0.3, W, H);
  cx.strokeStyle = 'rgba(245,195,207,.14)'; cx.lineWidth = 2;
  cx.beginPath(); cx.moveTo(0, cyw - H * 0.3); cx.lineTo(W, cyw - H * 0.3); cx.stroke();

  const ox = W / 2 - host.x * s, oy = cyw;
  cx.save(); cx.translate(ox, oy);

  const cast = [];
  PEOPLE.forEach((p, i) => {
    cast.push({ p, i, x: seatX(i), y: seatY(i), here: i === at });
  });
  cast.sort((a, b) => a.y - b.y);
  for (const c of cast){
    const size = SEAT * 0.72 * s;
    drawPersonOn(cx, c.x * s, c.y * s, size, c.p.sprite, 'down',
      c.here ? performance.now() * 0.1 : c.i * 300, c.here ? c.p.first : '', c.here);
  }
  // the host, drawn last so she's always in front
  drawPersonOn(cx, host.x * s, (seatY(at) + SEAT * 0.62) * s, SEAT * 0.8 * s,
    2, 'up', host.walkT, 'you');
  cx.restore();
}

/* ---------- go ---------- */
document.getElementById('gform').addEventListener('submit', e => {
  e.preventDefault();
  const v = document.getElementById('gpw').value.trim();
  if (v) enter(v, false);
});
resize();
if (PW) enter(PW, true);
</script>
</body>
</html>
