<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>the house 🤫 · khushi's slumber party</title>
<meta name="description" content="For guests." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* THE HOUSE — a top-down slumber party you can walk around.
     Deliberately 2D canvas and procedurally-drawn characters: no engine, no
     downloads, no asset pipeline, and it starts instantly on a phone over hotel
     wifi. The point isn't the graphics, it's "who else is coming" — so the whole
     thing is built around walking up to someone and reading their card. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  p,h1,h2{ margin:0; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:var(--wine-2); color:var(--cream); font-family:var(--mono);
    touch-action:none; user-select:none; -webkit-user-select:none; }

  /* ---- the word ---- */
  #gate{ position:fixed; inset:0; display:grid; place-items:center; padding:1.4rem; z-index:30;
    background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%); }
  .gbox{ text-align:center; width:min(22rem,100%); }
  .gbox img{ display:block; width:min(74%,15rem); margin:0 auto .8rem; }
  .gbox h1{ font-family:var(--serif); font-style:italic; font-size:1.75rem; margin:0 0 1.1rem; color:#fff; }
  .gbox form{ display:flex; gap:.5rem; }
  .gbox input{ flex:1; min-width:0; background:rgba(255,255,255,.06);
    border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:.6rem 1rem;
    color:var(--cream); font-family:var(--mono); font-size:1.3rem; outline:none; text-align:center; }
  .gbox input:focus{ border-color:var(--pink); }
  .gbox button{ flex:none; border:0; cursor:pointer; border-radius:100px; padding:.55rem 1.05rem;
    font-family:var(--pixel); font-size:.6rem; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .gbox .err{ min-height:1.5rem; margin-top:.7rem; font-size:1.1rem; color:#ffb3c6; }
  .gbox.no input{ animation:no .35s; }
  @keyframes no{ 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

  /* ---- who are you? ----
     Thirty-seven names is too many to scan, so it's a searchable grid with each
     guest's own character drawn beside their name — you look for your face, not
     your row. */
  #pick{ position:fixed; inset:0; display:none; z-index:25; overflow-y:auto;
    background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%); }
  #pick.on{ display:block; }
  .pkin{ max-width:44rem; margin:0 auto; padding:1.6rem 1rem 3rem; }
  .pktop{ font-family:var(--serif); font-style:italic; font-size:2rem; color:#fff; text-align:center; }
  .pksub{ font-size:1.1rem; color:var(--soft); text-align:center; margin:.3rem 0 1.1rem;
    max-width:26rem; margin-left:auto; margin-right:auto; line-height:1.35; }
  #pkq{ display:block; width:100%; max-width:22rem; margin:0 auto 1.1rem;
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.28); border-radius:100px;
    padding:.55rem 1.1rem; color:var(--cream); font-family:var(--mono); font-size:1.25rem;
    outline:none; text-align:center; -webkit-appearance:none; }
  #pkq:focus{ border-color:var(--pink); }
  #pkgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr)); gap:.55rem; }
  .pkcard{ display:flex; align-items:center; gap:.5rem; cursor:pointer; text-align:left;
    background:rgba(255,255,255,.05); border:1px solid rgba(245,195,207,.2); border-radius:.9rem;
    padding:.5rem .6rem; color:var(--cream); font-family:var(--mono); font-size:1.12rem;
    line-height:1.15; }
  .pkcard:hover{ border-color:var(--pink); background:rgba(235,100,140,.12); }
  .pkcard canvas{ width:2.6rem; height:2.6rem; flex:none; }
  .pkcard span{ min-width:0; overflow:hidden; text-overflow:ellipsis; }
  .pkcard i{ display:block; font-style:normal; font-size:.9rem; color:#7ddc9b; }
  .pkghost{ display:block; margin:1.3rem auto 0; background:none; border:0; cursor:pointer;
    color:var(--soft); font-family:var(--mono); font-size:1.15rem; text-decoration:underline;
    text-underline-offset:3px; }

  /* ---- the world ---- */
  #world{ position:fixed; inset:0; display:none; }
  #world.on{ display:block; }
  canvas{ display:block; width:100%; height:100%; image-rendering:pixelated; }

  /* room name, top-centre — the only persistent chrome */
  #roomTag{ position:fixed; top:calc(.7rem + env(safe-area-inset-top,0px)); left:0; right:0;
    text-align:center; font-family:var(--pixel); font-size:.62rem; letter-spacing:.14em;
    color:var(--yellow); text-shadow:0 0 10px rgba(255,233,168,.5); pointer-events:none; z-index:6; }
  #hint{ position:fixed; bottom:calc(.8rem + env(safe-area-inset-bottom,0px)); left:0; right:0;
    text-align:center; font-size:1.05rem; color:var(--soft); pointer-events:none; z-index:6;
    transition:opacity .4s; }

  /* who's online, top-left */
  #who{ position:fixed; top:calc(.6rem + env(safe-area-inset-top,0px)); left:.7rem; z-index:6;
    font-size:1rem; color:var(--soft); pointer-events:none; }
  #who i{ font-style:normal; color:#7ddc9b; }

  /* ---- the profile card ---- */
  #card{ position:fixed; left:50%; bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%) translateY(14px); width:min(20rem,calc(100vw - 2rem));
    background:var(--cream); color:var(--ink); border-radius:1.1rem; padding:.85rem 1rem;
    box-shadow:0 14px 40px rgba(0,0,0,.5); opacity:0; pointer-events:none;
    transition:opacity .18s ease, transform .18s ease; z-index:8; }
  #card.on{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
  #card .nm{ font-size:1.5rem; line-height:1.1; }
  #card .tr{ display:inline-block; font-family:var(--pixel); font-size:.5rem; letter-spacing:.08em;
    border:1px solid rgba(43,26,34,.3); border-radius:100px; padding:.2rem .4rem; margin-left:.35rem;
    vertical-align:middle; color:var(--rose); }
  #card .bl{ font-size:1.12rem; line-height:1.3; color:rgba(43,26,34,.72); margin-top:.25rem; }
  #card a{ display:inline-block; margin-top:.45rem; color:var(--rose); font-size:1.15rem;
    text-decoration:underline; text-underline-offset:2px; }

  /* ---- touch stick, mobile only ---- */
  #stick{ position:fixed; left:calc(1rem + env(safe-area-inset-left,0px));
    bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));
    width:8.4rem; height:8.4rem; border-radius:50%; z-index:7; display:none;
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.22); touch-action:none; }
  #stick b{ position:absolute; left:50%; top:50%; width:3.1rem; height:3.1rem; margin:-1.55rem 0 0 -1.55rem;
    border-radius:50%; background:rgba(235,100,140,.55); box-shadow:0 0 1rem rgba(235,100,140,.5); }
  body.touch #stick{ display:block; }

  /* ---- things to do ---- */
  #act{ position:fixed; right:calc(1rem + env(safe-area-inset-right,0px));
    bottom:calc(7.6rem + env(safe-area-inset-bottom,0px)); z-index:9;
    border:0; cursor:pointer; border-radius:100px; color:#fff; font-family:var(--pixel);
    font-size:.58rem; letter-spacing:.05em; padding:.85rem 1rem; max-width:9.5rem;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .3rem 1rem rgba(235,100,140,.45); }
  #emotes{ position:fixed; right:calc(1rem + env(safe-area-inset-right,0px));
    bottom:calc(1.4rem + env(safe-area-inset-bottom,0px)); z-index:9;
    display:grid; grid-template-columns:repeat(2,1fr); gap:.4rem; }
  #emotes button{ width:2.9rem; height:2.9rem; border-radius:50%; cursor:pointer; font-size:1.35rem;
    border:1px solid rgba(245,195,207,.24); background:rgba(255,255,255,.07); color:#fff; }
  #emotes button:active{ transform:scale(.92); }
  #nails{ position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(11.6rem + env(safe-area-inset-bottom,0px)); z-index:10; text-align:center;
    background:rgba(26,10,18,.86); border:1px solid rgba(245,195,207,.22); border-radius:1rem;
    padding:.6rem .8rem; }
  #nails p{ font-size:1rem; color:var(--soft); margin-bottom:.4rem; }
  #nailRow{ display:flex; gap:.4rem; }
  #nailRow button{ width:2rem; height:2rem; border-radius:50%; cursor:pointer;
    border:2px solid rgba(255,255,255,.3); }
  #shout{ position:fixed; left:0; right:0; bottom:calc(12.4rem + env(safe-area-inset-bottom,0px));
    text-align:center; font-family:var(--serif); font-style:italic; font-size:1.5rem; color:var(--yellow);
    text-shadow:0 2px 14px rgba(0,0,0,.7); z-index:10; opacity:0; transition:opacity .3s;
    pointer-events:none; padding:0 1rem; }
  #shout.on{ opacity:1; }

  /* the arcade door, when you're standing on it */
  #door{ position:fixed; left:50%; bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));
    transform:translateX(-50%); z-index:9; display:none; }
  #door.on{ display:block; }
  #door a{ display:block; font-family:var(--pixel); font-size:.62rem; letter-spacing:.06em; color:#fff;
    text-decoration:none; padding:.7rem 1.1rem; border-radius:100px;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .3rem 1rem rgba(235,100,140,.45); }
</style>
</head>
<body>

<div id="gate">
  <div class="gbox" id="gbox">
    <img src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <h1>what's the word?</h1>
    <form id="gform">
      <input id="gpw" type="password" autocomplete="off" autocapitalize="none" placeholder="•••••" />
      <button type="submit">GO IN ▸</button>
    </form>
    <p class="err" id="gerr"></p>
  </div>
</div>

<div id="pick">
  <div class="pkin">
    <p class="pktop">who are you?</p>
    <p class="pksub">pick yourself and you'll walk around as you. everyone else
      mills about on their own until they show up.</p>
    <input id="pkq" type="search" placeholder="find your name…" autocomplete="off" />
    <div id="pkgrid"></div>
    <button class="pkghost" id="pkGuest" type="button">just having a look ▸</button>
  </div>
</div>

<div id="world">
  <canvas id="cv"></canvas>
  <p id="who"></p>
  <p id="roomTag"></p>
  <div id="card"></div>
  <div id="door"><a href="/?arcade">▸ ENTER THE ARCADE</a></div>
  <p id="hint"></p>
  <div id="stick"><b></b></div>
  <!-- one button whose meaning follows the room you're standing in, plus emotes
       everyone can always fire. Kept to a single contextual action on purpose: a
       phone screen has no room for five verbs. -->
  <button id="act" type="button" hidden></button>
  <div id="emotes">
    <button type="button" data-e="👋">👋</button>
    <button type="button" data-e="💖">💖</button>
    <button type="button" data-e="🤫">🤫</button>
    <button type="button" data-e="😭">😭</button>
  </div>
  <div id="nails" hidden>
    <p>pick a colour</p>
    <div id="nailRow"></div>
  </div>
  <p id="shout"></p>
</div>

<script src="/assets/config.js"></script>
<script type="module">
/* ============================================================================
   THE HOUSE
   One map, four rooms, everyone who's coming standing in them. Walk up to
   somebody and their card opens — name, a line about them, their instagram.

   Everything is drawn in code: eight characters built from a palette rather
   than a spritesheet, so there's nothing to download and nothing to keep in
   sync. The map is a tile grid; walls are solid, doorways are gaps.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
let TOUCH = matchMedia('(hover:none) and (pointer:coarse)').matches;
if (TOUCH) document.body.classList.add('touch');
/* Some in-app browsers misreport pointer capabilities, and a guest who can't see
   the stick has no way to walk. A real touch is proof, so trust it over the query. */
addEventListener('touchstart', () => {
  TOUCH = true; document.body.classList.add('touch');
}, { once:true, passive:true });

/* ---------- the map ----------
   . floor   # wall   ~ doorway(floor)   A arcade portal
   Four rooms around a central landing, so every room is two steps from the
   middle and nobody gets lost. 40x26 keeps the whole house on one screen at
   desktop while still needing a camera on a phone. */
const MAP = [
  '########################################',
  '#........#............#................#',
  '#........#............#................#',
  '#..FORT..#...NAILS....#....TERRACE.....#',
  '#........#............#................#',
  '#........#............#................#',
  '#........#............#................#',
  '#........~............~................#',
  '#........#............#................#',
  '#........#............#................#',
  '##~#######............#######~##########',
  '#.....................................#.',
  '#.....................................#.',
  '#............................ ........#.',
  '#.....................................#.',
  '##~####################~###############.',
  '#........#..........................#..#',
  '#........#..........................#..#',
  '#..ARCADE#.........LOUNGE...........#..#',
  '#...AAA..#..........................#..#',
  '#...AAA..#..........................#..#',
  '#........#..........................#..#',
  '#........#..........................#..#',
  '########################################',
].map(r => r.padEnd(40, '#'));
const MH = MAP.length, MW = 40;
const TILE = 22;                       // world units per tile; the camera scales it

/* room lookup by tile, so the tag at the top always names where you are */
const ROOM_AT = (tx, ty) => {
  if (ty < 10) return tx < 9 ? 'fort' : tx < 22 ? 'nails' : 'terrace';
  if (ty < 15) return 'landing';
  return tx < 9 ? 'arcade' : 'lounge';
};
const ROOM_NAME = { fort:'THE PILLOW FORT', nails:'THE NAIL BAR', terrace:'THE TERRACE',
                    arcade:'THE ARCADE ROOM', lounge:'THE LOUNGE', landing:'THE LANDING' };
/* where each room's guests stand — a rectangle of floor to scatter them across */
const ROOM_BOX = {
  fort:    { x:2,  y:4,  w:6,  h:5 },
  nails:   { x:10, y:4,  w:11, h:5 },
  terrace: { x:23, y:4,  w:15, h:5 },
  arcade:  { x:2,  y:20, w:6,  h:2 },
  lounge:  { x:11, y:16, w:23, h:6 },
};
const solid = (tx, ty) => {
  if (tx < 0 || ty < 0 || tx >= MW || ty >= MH) return true;
  const ch = MAP[ty][tx];
  return ch === '#';
};
const isPortal = (tx, ty) => MAP[ty] && MAP[ty][tx] === 'A';

/* ---------- characters ----------
   Eight looks from one drawing routine. Hair, skin and pyjama colour are the
   only differences, which is enough to tell 37 people apart at a glance while
   keeping every character on-brand. */
const LOOKS = [
  { hair:'#3a2418', skin:'#f0c9a8', pj:'#eb648c' },
  { hair:'#1d1420', skin:'#e3b088', pj:'#8fd7ff' },
  { hair:'#7a4a2a', skin:'#f7dcc0', pj:'#ffe08a' },
  { hair:'#2b1a22', skin:'#c98d63', pj:'#a6f0c0' },
  { hair:'#4b2e5a', skin:'#f0c9a8', pj:'#eb9cff' },
  { hair:'#12100f', skin:'#8d5a3b', pj:'#ffc48a' },
  { hair:'#8a5a3c', skin:'#e8bd97', pj:'#9ab0ff' },
  { hair:'#241a2e', skin:'#d79c72', pj:'#ff9ab0' },
];

/* Takes a context so the same routine draws the world AND the little portraits
   in the character picker — one character definition, never two that drift. */
function drawPersonOn(g, px, py, s, look, facing, walkT, label, pjOverride){
  const base = LOOKS[look % LOOKS.length];
  const L = pjOverride ? { ...base, pj: pjOverride } : base;
  const bob = Math.sin(walkT * 0.018) * s * 0.05;
  const y = py + bob;
  g.fillStyle = 'rgba(0,0,0,.28)';
  g.beginPath(); g.ellipse(px, py + s * 0.46, s * 0.3, s * 0.11, 0, 0, 7); g.fill();
  g.fillStyle = L.pj;
  rrOn(g, px - s * 0.24, y - s * 0.06, s * 0.48, s * 0.5, s * 0.14); g.fill();
  const step = Math.sin(walkT * 0.02) * s * 0.08;
  g.fillStyle = L.pj;
  g.fillRect(px - s * 0.17, y + s * 0.38, s * 0.13, s * 0.12 + step);
  g.fillRect(px + s * 0.04, y + s * 0.38, s * 0.13, s * 0.12 - step);
  g.fillStyle = L.skin;
  g.beginPath(); g.arc(px, y - s * 0.24, s * 0.22, 0, 7); g.fill();
  g.fillStyle = L.hair;
  g.beginPath(); g.arc(px, y - s * 0.28, s * 0.23, Math.PI * 0.98, Math.PI * 2.02); g.fill();
  if (facing !== 'up'){
    g.fillStyle = '#2b1a22';
    const ex = facing === 'left' ? -s * 0.07 : facing === 'right' ? s * 0.07 : 0;
    g.beginPath();
    g.arc(px + ex - s * 0.07, y - s * 0.22, s * 0.028, 0, 7);
    g.arc(px + ex + s * 0.07, y - s * 0.22, s * 0.028, 0, 7);
    g.fill();
  }
  if (label){
    g.font = '600 ' + Math.max(9, s * 0.26) + 'px ui-monospace, monospace';
    g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    g.fillStyle = 'rgba(26,10,18,.75)';
    const w = g.measureText(label).width + s * 0.2;
    rrOn(g, px - w / 2, y - s * 0.78, w, s * 0.3, s * 0.1); g.fill();
    g.fillStyle = '#ffe9a8';
    g.fillText(label, px, y - s * 0.57);
  }
}
const drawPerson = (px, py, s, look, facing, walkT, label, pj) =>
  drawPersonOn(cx, px, py, s, look, facing, walkT, label, pj);

function drawStarAt(px, py, r){
  cx.save(); cx.translate(px, py);
  cx.fillStyle = '#ffd84a'; cx.shadowColor = '#ffd84a'; cx.shadowBlur = r * 1.6;
  cx.beginPath();
  for (let i = 0; i < 10; i++){
    const a = i * Math.PI / 5 - Math.PI / 2, rad = (i % 2 ? r * 0.42 : r);
    cx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  cx.closePath(); cx.fill(); cx.restore();
}
function drawPillowAt(px, py, s){
  cx.save(); cx.translate(px, py);
  cx.fillStyle = '#fff6f8';
  rrOn(cx, -s / 2, -s / 2 * 0.8, s, s * 0.8, s * 0.3); cx.fill();
  cx.strokeStyle = 'rgba(60,20,40,.25)'; cx.lineWidth = Math.max(1, s * 0.05);
  rrOn(cx, -s * 0.34, -s * 0.26, s * 0.68, s * 0.52, s * 0.14); cx.stroke();
  cx.restore();
}
function rrOn(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r); g.closePath();
}
const rr = (x, y, w, h, r) => rrOn(cx, x, y, w, h, r);

/* ---------- state ---------- */
let PEOPLE = [], me = { x: 20 * TILE, y: 12.5 * TILE, facing:'down', walkT: 0 },
    keys = {}, stick = { dx:0, dy:0, on:false },
    near = null, room = '', online = 1, chan = null, PW = null,
    /* MINE is the guest I'm playing as, or null for a nameless onlooker.
       CLAIMED maps guest name -> live state broadcast by whoever is playing them,
       which is what turns a milling NPC into a person someone is driving. */
    MINE = null,
    /* CLAIMS: guest name -> presence key of whoever is playing them (who's here).
       LIVE:   presence key -> their last broadcast position (where they are).
       Two maps because the two questions update at completely different rates. */
    CLAIMS = new Map(), LIVE = new Map(), moved = false, lastSent = 0;
try { PW = sessionStorage.getItem('ssp-itin'); } catch(e){}

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- the word ---------- */
async function fetchPeople(pw){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'') + '/functions/v1/house', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey,
              Authorization:'Bearer ' + CFG.supabaseAnonKey },
    body: JSON.stringify({ password: pw })
  });
  if (r.status === 401) return { wrong:true };
  if (r.status === 429) return { rate:true };
  const j = await r.json().catch(() => ({}));
  return j.ok ? j : {};
}

async function enter(pw, quiet){
  const res = await fetchPeople(pw);
  if (res.people){
    PW = pw;
    try { sessionStorage.setItem('ssp-itin', pw); } catch(e){}
    place(res.people);
    document.getElementById('gate').style.display = 'none';
    resize(); joinPresence();           // presence first, so the picker can show who's taken
    openPicker();
    return true;
  }
  if (!quiet){
    const box = document.getElementById('gbox');
    document.getElementById('gerr').textContent =
      res.rate ? 'too many tries — give it a while 🙏' : res.wrong ? "that's not it 👀" : 'hmm, try again';
    box.classList.remove('no'); void box.offsetWidth; box.classList.add('no');
  }
  return false;
}

/* Scatter each room's guests over its floor, deterministically — the same person
   stands in the same spot every visit, so the house has a memory. */
function place(people){
  const byRoom = {};
  for (const p of people) (byRoom[p.room] = byRoom[p.room] || []).push(p);
  PEOPLE = [];
  for (const key in byRoom){
    const box = ROOM_BOX[key] || ROOM_BOX.lounge, list = byRoom[key];
    const cols = Math.max(1, Math.min(box.w, Math.ceil(Math.sqrt(list.length * (box.w / box.h)))));
    list.forEach((p, i) => {
      const c = i % cols, r = Math.floor(i / cols);
      const tx = box.x + (c * (box.w - 1)) / Math.max(1, cols - 1);
      const rows = Math.max(1, Math.ceil(list.length / cols));
      const ty = box.y + (r * (box.h - 1)) / Math.max(1, rows - 1);
      const hx = (tx + 0.5) * TILE, hy = (ty + 0.5) * TILE;
      // hx/hy is home; seed makes their drift theirs alone and stable across visits
      let seed = 0; for (const ch of p.name) seed = (seed * 31 + ch.charCodeAt(0)) % 997;
      PEOPLE.push({ ...p, x:hx, y:hy, hx, hy, seed, walkT: i * 400 });
    });
  }
}

/* ============================================================================
   THINGS TO DO
   Every room has one verb, and it's the same button — its meaning follows where
   you're standing, because a phone screen has no room for five of them. All of it

const NAIL_COLOURS = ['#eb648c','#ffd84a','#8fd7ff','#a6f0c0','#eb9cff','#ff9ab0','#ffc48a','#c9a0ae'];

/* Broadcast anything doable. Same channel as movement — it was never presence that
   had the rate limit, and these are human-paced events, not per-frame. */
function doAct(payload){
  applyAct({ ...payload, id: meId });                    // show it locally at once
  if (chan && chan.state === 'joined')
    chan.send({ type:'broadcast', event:'act', payload:{ ...payload, id: meId } });
}

function applyAct(a){

  } else if (a.kind === 'emote'){

const emotes = new Map();              // who is emoting, and what
const nailsOf = new Map();             // presence key -> chosen colour

function roomAction(){
  const v = ROOM_VERB[room];

    const d = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] }[me.facing] || [0,1];
    doAct({ kind:'pillow', x:me.x, y:me.y, vx:d[0] * 0.42, vy:d[1] * 0.42,

    const pool = here.length ? here : PEOPLE.filter(p => !MINE || p.name !== MINE.name);

function paintNailRow(){

/* ---------- milling about ----------
   Unclaimed guests drift around the spot they were placed on. Deliberately a
   smooth function of the clock rather than a random walk: every device computes
   the same position from the same time, so two people looking at their phones
   side by side see the same room — and it can never wander into a wall, because
   the amplitude is smaller than the floor it sits on.
   The moment someone claims a character this is ignored entirely and their real
   position takes over. */
/* Where a guest actually is: driven by their player if someone's claimed them and
   still broadcasting, otherwise drifting. One answer, used by both the renderer
   and the proximity check, so a card can never open on a body that isn't there. */
const STALE = 6000;                      // no word for six seconds = they've gone
const SMOOTH = 210;                      // just over the send interval, so motion never stalls
function smooth(pos){
  if (pos.fx === undefined) return pos;
  const k = Math.min(1, (performance.now() - pos.t0) / SMOOTH);
  return { ...pos, x: pos.fx + (pos.x - pos.fx) * k, y: pos.fy + (pos.y - pos.fy) * k };
}
function liveAt(name){
  const key = CLAIMS.get(name);
  if (!key) return null;
  const pos = LIVE.get(key);
  if (!pos || Date.now() - pos.t > STALE) return null;
  return smooth(pos);
}
function wanderAt(p, ms){
  const t = ms / 1000, a = p.seed * 1.7, b = p.seed * 0.9;
  return {
    x: p.hx + Math.sin(t * 0.33 + a) * TILE * 0.42 + Math.sin(t * 0.11 + b) * TILE * 0.16,
    y: p.hy + Math.cos(t * 0.27 + b) * TILE * 0.34,
  };
}

/* ---------- who are you? ----------
   Claiming a character is the whole hook: from that moment the guest everyone
   else sees milling about is you, moving where you move. Anyone still unclaimed
   keeps drifting around their room on their own. */
function openPicker(){

  };

  document.getElementById('pkGuest').addEventListener('click', () => become(null));
  refreshPicker = render;                    // presence sync repaints the "here now" marks
  render();
  document.getElementById('pick').classList.add('on');
}
let refreshPicker = () => {};

function become(p){
  MINE = p;
  if (p){ me.x = p.x; me.y = p.y; }            // you start where your character was standing
  document.getElementById('pick').classList.remove('on');
  document.getElementById('world').classList.add('on');
  hint(TOUCH ? 'drag the circle to walk · go up to someone'
             : 'arrows or wasd to walk · go up to someone');

  resize();

  moved = true;                       // and put a first position on the wire
  if (myPj) doAct({ kind:'nails', c: myPj });   // nails you painted last visit still count
  if (!raf) loop();

/* ---------- presence ----------
   The reason to come back: you can see who else is in the house right now. One
   Realtime channel, positions broadcast a few times a second. No database
   writes — presence is ephemeral by nature, and a party lobby doesn't need a
   history of where people stood. */
let meId = Math.random().toString(36).slice(2, 9);
/* What this device is broadcasting: where I am, and which guest I'm being. `g` is
   the claim — the moment it's set, every other device stops wandering that
   character and starts drawing them wherever I walk. */
/* Presence payload — identity only, so it changes rarely and never rate-limits. */
function claimState(){
  return { g: MINE ? MINE.name : null, look: myLook, at: Date.now() };
}
const myState = claimState;          // kept for the one caller in become()
let sbClient = null, joining = false, beat = 0;
async function joinPresence(){
  if (chan || joining || !CFG.supabaseUrl) return;
  joining = true;                      // the import awaits, so two callers could both get past a chan check
  try {
    const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
    /* The client MUST be held at module scope. It was a local const, so once this
       function returned nothing referenced it and its socket went with it —
       presence joined and closed again a moment later, which is exactly what the
       status log showed: SUBSCRIBED, CLOSED, silence. */
    sbClient = sbClient || createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, { auth:{ persistSession:false } });
    const sb = sbClient;
    chan = sb.channel('house', { config:{ presence:{ key: meId } } });
    /* live positions arrive here, keyed by sender, and expire on their own if a
       phone walks out of signal — a stale body left standing in a room forever
       would be worse than one that quietly leaves. */
    chan.on('broadcast', { event:'pos' }, ({ payload:v }) => {
      if (!v || v.id === meId || typeof v.x !== 'number') return;
      /* Keep where they WERE and where they're GOING, and let the renderer walk
         between the two. Snapping straight to each packet is what makes a body
         look like it's teleporting five times a second — the packets are fine,
         it's the drawing that has to be continuous. */
      const prev = LIVE.get(v.id);
      LIVE.set(v.id, {
        g: v.g || null, f: v.f || 'down', t: Date.now(),
        fx: prev ? prev.x : v.x, fy: prev ? prev.y : v.y,   // from
        x: v.x, y: v.y,                                      // to
        t0: performance.now(),
      });
    });
    chan.on('broadcast', { event:'act' }, ({ payload:a }) => {
      if (!a || a.id === meId) return;          // ours already showed locally
      applyAct(a);
    });
    chan.on('presence', { event:'sync' }, () => {
      const st = chan.presenceState();
      online = Math.max(1, Object.keys(st).length);
      CLAIMS.clear();
      for (const k in st){
        const v = st[k] && st[k][0];
        if (!v) continue;
        if (v.g) CLAIMS.set(v.g, k);               // guest name -> who is playing them
      }
      paintWho();
      if (document.getElementById('pick').classList.contains('on')) refreshPicker();
    });
    await chan.subscribe(async (st) => {
      subLog.push(st);
      if (st === 'SUBSCRIBED'){
        /* PRESENCE says who is here; BROADCAST says where they are.
           Using presence for position killed the channel: track() at 330ms trips
           Realtime's rate limit and the server closes it — proven by isolating a
           stable channel and watching it die the moment fast tracking started.
           Presence now updates only when the claim changes, and movement rides a
           broadcast, which is what broadcast is for. */
        await chan.track(claimState());
        if (!beat) beat = setInterval(() => {
          if (!chan || chan.state !== 'joined') return;
          /* Send when moving; otherwise a heartbeat every couple of seconds so a
             player standing still doesn't age past STALE and vanish. Broadcast is
             cheap — it was PRESENCE that had the rate limit. */
          const idle = Date.now() - lastSent > 2000;
          if (!moved && !idle) return;
          moved = false; lastSent = Date.now();
          chan.send({ type:'broadcast', event:'pos',
                      payload:{ id:meId, g: MINE ? MINE.name : null, x:me.x, y:me.y, f:me.facing } });
        }, 130);
      }
      /* Phones sleep, wifi drops, and a party lasts two days — so a closed channel
         retries instead of silently leaving someone invisible to the room. */
      if (st === 'CLOSED' || st === 'CHANNEL_ERROR' || st === 'TIMED_OUT'){
        const dead = chan; chan = null; joining = false;
        setTimeout(() => { if (!chan && dead) { try { dead.unsubscribe(); } catch(e){} joinPresence(); } }, 2500);
      }
    });
  } catch(e){
    /* presence is a bonus — the house still works alone — but swallowing the
       reason made a silent failure impossible to diagnose. */
    presenceError = String(e && e.message || e);
    console.warn('house presence unavailable:', presenceError);
  } finally { joining = false; }
}
let presenceError = null, subLog = [];
/* A hook for looking under the bonnet on the night, when something is wrong and
   nobody can open a debugger. Exposes only what's already on the page. */
window.__house = {
  state: () => ({ mine: MINE && MINE.name, claims: [...CLAIMS.keys()],
                  livePositions: LIVE.size, online, presenceError,
                  channel: chan ? chan.state : 'none', subLog: [...subLog] }),
};
const myLook = Math.floor(Math.random() * LOOKS.length);
function paintWho(){
  const n = Math.max(1, online);
  document.getElementById('who').innerHTML =
    '<i>●</i> ' + n + (n === 1 ? ' person here' : ' people here');
}

/* ---------- input ---------- */
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

(function stickSetup(){
  const el = document.getElementById('stick'), nub = el.querySelector('b');
  let id = null, cxp = 0, cyp = 0, R = 1;
  const start = e => { const t = e.changedTouches ? e.changedTouches[0] : e;
    id = t.identifier ?? 'm'; const r = el.getBoundingClientRect();
    cxp = r.left + r.width / 2; cyp = r.top + r.height / 2; R = r.width * 0.34; stick.on = true; move(e); };
  const move = e => {
    if (!stick.on) return;
    const list = e.changedTouches ? [...e.changedTouches] : [e];
    const t = list.find(t => (t.identifier ?? 'm') === id) || list[0];
    let dx = t.clientX - cxp, dy = t.clientY - cyp;
    const d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / R);
    dx = dx / d * k; dy = dy / d * k;
    stick.dx = dx; stick.dy = dy;
    nub.style.transform = 'translate(' + (dx * R) + 'px,' + (dy * R) + 'px)';
  };
  const end = () => { stick.on = false; stick.dx = stick.dy = 0; nub.style.transform = ''; };
  el.addEventListener('touchstart', start, { passive:true });
  el.addEventListener('touchmove', move, { passive:true });
  el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  el.addEventListener('pointerdown', e => { if (!TOUCH) return; start(e); });
  addEventListener('pointermove', e => { if (stick.on && !e.changedTouches) move(e); });
  addEventListener('pointerup', end);
})();

/* ---------- camera + resize ---------- */
let view = { s:1, ox:0, oy:0 }, raf = 0;
function resize(){
  const dpr = Math.min(2, devicePixelRatio || 1);
  const w = innerWidth, h = innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  /* COVER, not fit. The house is much wider than it is tall, so fitting it left
     half a portrait phone as black bands above and below. Covering fills the
     screen at every shape and lets the camera pan instead — which is also how
     faces stay big enough to recognise on a small screen. Capped so a tiny
     viewport can't zoom to absurdity. */
  view.s = Math.min(2.4, Math.max(w / (MW * TILE), h / (MH * TILE)));
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 250));

/* ---------- the loop ---------- */
let last = 0, lastFrameAt = 0;
function frame(now){
  const t = now || performance.now();
  const dt = Math.min(50, last ? t - last : 16); last = t; lastFrameAt = Date.now();
  step(dt); draw();
}
function loop(t){
  raf = requestAnimationFrame(loop);
  frame(t);
}
/* requestAnimationFrame is the right driver, but it isn't guaranteed: it's paused
   in a background tab (correct — nobody needs the house simulated while they read
   a message) and some in-app browsers starve it in states we can't detect. Guests
   will open this inside Instagram, so a watchdog steps the world if no frame has
   run for a quarter second. Belt and braces, and it costs one timer. */
setInterval(() => {
  if (!PEOPLE.length) return;                       // not in the house yet
  if (document.hidden) { last = 0; return; }         // don't accumulate while away
  if (Date.now() - lastFrameAt > 250) frame();
}, 120);
function step(dt){
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;
  dx += stick.dx; dy += stick.dy;
  const m = Math.hypot(dx, dy);
  if (m > 1){ dx /= m; dy /= m; }
  const spd = TILE * 0.0062 * dt;
  if (dx || dy){
    me.facing = Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 'left' : 'right') : (dy < 0 ? 'up' : 'down');
    me.walkT += dt * 2.2;
    // axes resolved separately so you slide along a wall instead of sticking to it
    tryMove(dx * spd, 0); tryMove(0, dy * spd);
    moved = true;                     // something to tell the room about
  }
  for (const p of PEOPLE) p.walkT += dt * 0.5;   // idle sway

  /* thrown pillows: fly, then stop at the first wall — the same solid() the
     walking uses, so nothing sails through the house */
  for (const q of pillows){
    q.t += dt;
    const nx = q.x + q.vx * dt, ny = q.y + q.vy * dt;
    if (solid(Math.floor(nx / TILE), Math.floor(ny / TILE))){ q.vx = q.vy = 0; }
    else { q.x = nx; q.y = ny; }
  }
  pillows = pillows.filter(q => q.t < 2600);
  wishes = wishes.filter(w => Date.now() - w.t < 60000);   // a wish lingers a minute
  for (const [k, v] of emotes) if (Date.now() - v.t > 2600) emotes.delete(k);
  if (bottle && Date.now() - bottle.t > 4000) bottle = null;

  /* nearest guest within reach — measured where they are RIGHT NOW, which for a
     milling guest is their drift position and for a claimed one is their player's.
     Testing against the home tile would open cards for someone stood elsewhere. */
  let best = null, bd = TILE * 1.5;
  const now2 = Date.now();
  for (const p of PEOPLE){
    if (MINE && p.name === MINE.name) continue;        // that's you
    const at = liveAt(p.name) || wanderAt(p, now2);
    const d = Math.hypot(at.x - me.x, at.y - me.y);
    if (d < bd){ bd = d; best = p; }
  }
  if (best !== near){ near = best; paintCard(); }

  const tx = Math.floor(me.x / TILE), ty = Math.floor(me.y / TILE);
  const r = ROOM_AT(tx, ty);
  if (r !== room){
    room = r;
    document.getElementById('roomTag').textContent = ROOM_NAME[r] || '';
    const v = ROOM_VERB[r], btn = document.getElementById('act');
    btn.hidden = !v;
    if (v){ btn.textContent = v.label; if (v.kind === 'nails') paintNailRow(); }
    document.getElementById('nails').hidden = true;      // never leave it open in another room
  }
  document.getElementById('door').classList.toggle('on', isPortal(tx, ty));
}
function tryMove(dx, dy){
  const nx = me.x + dx, ny = me.y + dy, pad = TILE * 0.3;
  for (const cxp of [nx - pad, nx + pad]) for (const cyp of [ny - pad, ny + pad])
    if (solid(Math.floor(cxp / TILE), Math.floor(cyp / TILE))) return;
  me.x = nx; me.y = ny;
}

function paintCard(){
  const el = document.getElementById('card');
  if (!near){ el.classList.remove('on'); return; }
  const ig = near.instagram
    ? `<a href="https://instagram.com/${encodeURIComponent(near.instagram)}" target="_blank" rel="noopener">@${esc(near.instagram)} ↗</a>`
    : '';
  const tier = near.tier === 'super' ? 'SUPER GUEST' : String(near.tier || '').toUpperCase();
  el.innerHTML = `<p class="nm">${esc(near.name)}<span class="tr">${esc(tier)}</span></p>` +
    (near.blurb ? `<p class="bl">${esc(near.blurb)}</p>` : '<p class="bl">one of the thirty-five 🤫</p>') + ig;
  el.classList.add('on');
}

let hintT = 0;
function hint(text){
  const el = document.getElementById('hint');
  el.textContent = text; el.style.opacity = '1';
  clearTimeout(hintT); hintT = setTimeout(() => el.style.opacity = '0', 5200);
}

function draw(){
  const W = innerWidth, H = innerHeight, s = view.s, T = TILE * s;
  cx.fillStyle = '#140b12'; cx.fillRect(0, 0, W, H);
  // camera follows, then is clamped so you never see past the walls
  let ox = W / 2 - me.x * s, oy = H / 2 - me.y * s;
  if (MW * T <= W) ox = (W - MW * T) / 2; else ox = Math.min(0, Math.max(W - MW * T, ox));
  if (MH * T <= H) oy = (H - MH * T) / 2; else oy = Math.min(0, Math.max(H - MH * T, oy));
  view.ox = ox; view.oy = oy;
  cx.save(); cx.translate(ox, oy);

  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++){
    const ch = MAP[y][x], px = x * T, py = y * T;
    if (ch === '#'){
      cx.fillStyle = '#3a2438'; cx.fillRect(px, py, T + 1, T + 1);
      cx.fillStyle = 'rgba(255,255,255,.04)'; cx.fillRect(px, py, T + 1, T * 0.18);
    } else {
      const r = ROOM_AT(x, y);
      cx.fillStyle = r === 'fort' ? '#40243a' : r === 'nails' ? '#3b2340'
                   : r === 'terrace' ? '#2f2b46' : r === 'arcade' ? '#341f33'
                   : r === 'lounge' ? '#3d2436' : '#2c1c2b';
      cx.fillRect(px, py, T + 1, T + 1);
      if ((x + y) % 2 === 0){ cx.fillStyle = 'rgba(255,255,255,.018)'; cx.fillRect(px, py, T + 1, T + 1); }
      if (ch === 'A'){ cx.fillStyle = 'rgba(255,216,74,.14)'; cx.fillRect(px, py, T + 1, T + 1); }
    }
  }
  // room labels, painted into the floor
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  for (const k in ROOM_BOX){
    const b = ROOM_BOX[k];
    cx.font = '700 ' + Math.max(8, T * 0.5) + 'px "Press Start 2P", ui-monospace, monospace';
    cx.fillStyle = 'rgba(255,255,255,.055)';
    cx.fillText((ROOM_NAME[k] || k).replace('THE ', ''), (b.x + b.w / 2) * T, (b.y - 1.4) * T);
  }

  /* One cast, three kinds of body:
       · me            — drawn from my own input, labelled "you"
       · claimed       — a real person on another device driving that guest
       · still milling — nobody's here yet, so they drift around their spot
     Sorted by y so nearer bodies overlap further ones. */
  const now = Date.now();
  const cast = [];
  for (const p of PEOPLE){
    const mineHere = MINE && p.name === MINE.name;
    if (mineHere){
      cast.push({ ...p, x:me.x, y:me.y, facing:me.facing, walkT:me.walkT, label:'you', live:true, isMe:true });
      continue;
    }
    const held = liveAt(p.name);
    if (held){
      cast.push({ ...p, x:held.x, y:held.y, facing:held.f, walkT:now * 0.6, label:p.first, live:true });
    } else {
      const w = wanderAt(p, now);
      cast.push({ ...p, x:w.x, y:w.y, facing:'down', walkT:p.walkT + now * 0.12, label:p.first });
    }
  }
  // people who came to look without taking a character
  for (const [, o] of LIVE){
    if (o.g || now - o.t > STALE) continue;          // claimed bodies are drawn above
    const q = smooth(o);
    cast.push({ x:q.x, y:q.y, sprite:0, facing:q.f || 'down', walkT:now * 0.6,
                label:'someone', ghost:true, live:true });
  }
  if (!MINE) cast.push({ x:me.x, y:me.y, sprite:myLook, facing:me.facing, walkT:me.walkT,
                         label:'you', isMe:true, ghost:true });
  cast.sort((a, b) => a.y - b.y);

  // wishes first: they sit on the floor behind everybody
  for (const w of wishes){
    const age = (Date.now() - w.t) / 60000;
    cx.save(); cx.globalAlpha = Math.max(0.15, 1 - age);
    drawStarAt(w.x * s, w.y * s, T * 0.3);
    cx.restore();
  }

  for (const p of cast){
    if (p.ghost) cx.globalAlpha = 0.8;
    const pj = p.isMe ? myPj : (p.name ? nailsOf.get(CLAIMS.get(p.name)) : null);
    drawPerson(p.x * s, p.y * s, T * 1.35, p.sprite, p.facing, p.walkT,
      // names appear for you, whoever you're standing next to, and anyone actually here
      (p.isMe || p.live || (near && p.name === near.name)) ? p.label : '', pj);
    // a live person gets a green pip, so you can tell a real guest from a drifting one
    if (p.live && !p.isMe){
      cx.fillStyle = '#7ddc9b';
      cx.beginPath(); cx.arc(p.x * s + T * 0.42, p.y * s - T * 0.5, Math.max(2, T * 0.09), 0, 7); cx.fill();
    }
    // an emote floats above whoever fired it
    const key = p.isMe ? meId : (p.name ? CLAIMS.get(p.name) : null);
    const em = key && emotes.get(key);
    if (em){
      const lift = Math.min(1, (Date.now() - em.t) / 900);
      cx.font = Math.max(14, T * 0.7) + 'px system-ui, sans-serif';
      cx.textAlign = 'center'; cx.textBaseline = 'middle';
      cx.globalAlpha = 1 - lift * 0.55;
      cx.fillText(em.e, p.x * s, p.y * s - T * (0.95 + lift * 0.6));
    }
    cx.globalAlpha = 1;
  }

  // pillows in flight, drawn over everyone so a throw is always readable
  for (const q of pillows){
    cx.globalAlpha = Math.max(0, 1 - q.t / 2600);
    drawPillowAt(q.x * s, q.y * s, T * 0.5);
    cx.globalAlpha = 1;
  }
  cx.restore();
}

/* ---------- go ---------- */
document.getElementById('gform').addEventListener('submit', e => {
  e.preventDefault();
  const v = document.getElementById('gpw').value.trim();
  if (v) enter(v, false);
});
resize();
if (PW) enter(PW, true);      // came from the programme in the same session
</script>
