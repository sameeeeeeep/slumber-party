<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>the puzzle · the wall</title>
<meta name="description" content="The wall." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* THE WALL. Projected, touched by nobody, and the only place the picture exists.

     One image, no slicing: every piece is a div showing a shifted region of the
     same file via background-position, so there are no forty cropped files to
     generate and a piece can appear the instant it's claimed. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; }
  p,h1{ margin:0; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); }

  #gate{ height:100%; display:grid; place-items:center; padding:1.4rem; }
  .gbox{ text-align:center; width:min(22rem,100%); }
  .gbox img{ display:block; width:min(74%,15rem); margin:0 auto .8rem; }
  .gbox h1{ font-family:var(--serif); font-style:italic; font-size:1.7rem; margin:0 0 1.1rem; color:#fff; }
  .gbox form{ display:flex; gap:.5rem; }
  .gbox input{ flex:1; min-width:0; background:rgba(255,255,255,.06);
    border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:.6rem 1rem;
    color:var(--cream); font-family:var(--mono); font-size:1.3rem; outline:none; text-align:center; }
  .gbox button{ flex:none; border:0; cursor:pointer; border-radius:100px; padding:.55rem 1.05rem;
    font-family:var(--pixel); font-size:.6rem; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); }
  .gbox .err{ min-height:1.5rem; margin-top:.7rem; font-size:1.1rem; color:#ffb3c6; }

  #wall{ display:none; height:100%; grid-template-rows:1fr auto; }
  #wall.on{ display:grid; }

  .stage{ display:grid; place-items:center; min-height:0; padding:1.2rem; }
  /* the board keeps the image's own shape, so pieces are never stretched */
  #board{ position:relative; display:grid; width:100%; height:100%;
    max-width:100%; max-height:100%; }
  #board .cell{ position:relative; }
  /* the empty slots: just enough to read the shape of what's coming */
  #board .cell::before{ content:''; position:absolute; inset:1px; border-radius:3px;
    background:rgba(255,255,255,.035); box-shadow:inset 0 0 0 1px rgba(245,195,207,.07); }
  #board .cell.on::before{ display:none; }
  #board .cell .pc{ position:absolute; inset:0; background-image:var(--img);
    background-repeat:no-repeat; opacity:0; transform:scale(1.25); }
  #board .cell.on .pc{ animation:land .5s cubic-bezier(.2,.9,.3,1.2) forwards; }
  @keyframes land{ to{ opacity:1; transform:scale(1); } }
  #board .cell .nm{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    font-family:var(--pixel); font-size:.62rem; color:#fff; white-space:nowrap; z-index:3;
    background:rgba(20,10,16,.78); border-radius:100px; padding:.3rem .55rem;
    animation:nameOut 2.6s forwards; }
  @keyframes nameOut{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1)} 72%{opacity:1} 100%{opacity:0} }

  /* the finish: grid lines go, the picture takes the room */
  #wall.done #board .cell::before{ display:none; }
  #wall.done #board{ gap:0 !important; }
  #wall.done footer{ opacity:0; transition:opacity .8s; }
  #done{ position:fixed; inset:0; display:none; place-items:center; z-index:5;
    background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%); }
  #done.on{ display:grid; animation:fadeIn 1s; }
  @keyframes fadeIn{ from{opacity:0} }
  #done img{ width:min(88vw,1400px); max-height:76vh; object-fit:contain;
    animation:pop 1.1s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes pop{ from{ opacity:0; transform:scale(.94); } }
  #done p{ margin-top:1.6rem; font-family:var(--pixel); font-size:.8rem; letter-spacing:.2em;
    color:var(--yellow); text-align:center; animation:fadeIn 1.2s .7s both; }

  footer{ display:flex; align-items:center; gap:1.4rem; padding:.7rem 1.2rem;
    border-top:1px solid rgba(245,195,207,.14); }
  footer img.logo{ height:2.5rem; }
  .stat{ text-align:center; }
  .big{ font-family:var(--pixel); font-size:1.7rem; color:var(--yellow); line-height:1;
    text-shadow:0 0 18px rgba(255,233,168,.4); }
  .lbl{ font-family:var(--pixel); font-size:.48rem; letter-spacing:.13em; color:var(--soft);
    margin-top:.25rem; }
  .bar{ flex:1; height:.5rem; border-radius:100px; background:rgba(255,255,255,.1); }
  .bar i{ display:block; height:100%; border-radius:100px; transition:width .5s;
    background:linear-gradient(90deg,var(--pink),var(--yellow)); }
  .waiting{ text-align:center; color:var(--soft); font-size:1.7rem; line-height:1.5; }
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <img src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <h1>the wall</h1>
    <form id="gform">
      <input id="gpw" type="password" autocomplete="off" autocapitalize="none" placeholder="•••••" />
      <button type="submit">OPEN ▸</button>
    </form>
    <p class="err" id="gerr"></p>
  </div>
</div>

<div id="wall">
  <div class="stage"><div id="board"></div></div>
  <footer>
    <img class="logo" src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <div class="stat"><p class="big" id="placed">0</p><p class="lbl">PIECES</p></div>
    <div class="stat"><p class="big" id="people">0</p><p class="lbl">PEOPLE</p></div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
  </footer>
</div>

<div id="done"><div><img id="doneImg" alt="" /><p id="doneLine"></p></div></div>

<script src="/assets/config.js"></script>
<script>
/* ============================================================================
   /puzzle/wall — the projected side.

   Polls, like the nail board's wall, and for the same reason: guests have no
   SELECT on these tables so a realtime subscription would need auth a projector
   doesn't have, and at one tap a second a one-second poll is indistinguishable
   from live with nothing to reconnect when the room's wifi hiccups.

   Draws only what changed. A full repaint would restart forty animations every
   tick, which is what made the first nail-board wall flicker.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const FN = CFG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/puzzle';
const POLL = 1200;
let PW = null, grid = null, on = new Set(), finished = false;
try { PW = sessionStorage.getItem('ssp-itin'); } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function fetchBoard(pw) {
  const r = await fetch(FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey,
               Authorization: 'Bearer ' + CFG.supabaseAnonKey },
    body: JSON.stringify({ password: pw, action: 'board' }),
  });
  if (r.status === 401) return { wrong: true };
  if (r.status === 429) return { rate: true };
  return await r.json().catch(() => ({}));
}

/* Lay the grid out once. Each cell is positioned by background-position in
   PERCENTAGES, which is the trick that makes a CSS jigsaw work: with a background
   sized cols×100% by rows×100%, position 0%..100% spreads the image across the
   cells exactly, no arithmetic in pixels and nothing to recompute on resize. */
function build(p) {
  grid = { cols: p.cols, rows: p.rows, url: p.url };
  on = new Set(); finished = false;
  const b = $('board');
  b.style.gridTemplateColumns = `repeat(${p.cols},1fr)`;
  b.style.gridTemplateRows = `repeat(${p.rows},1fr)`;
  b.style.aspectRatio = '';
  b.style.gap = '3px';
  b.innerHTML = Array.from({ length: p.cols * p.rows }, (_, i) => {
    const x = i % p.cols, y = Math.floor(i / p.cols);
    const px = p.cols > 1 ? (x / (p.cols - 1)) * 100 : 0;
    const py = p.rows > 1 ? (y / (p.rows - 1)) * 100 : 0;
    return `<div class="cell" data-i="${i}"><div class="pc" style="
      --img:url('${p.url}');
      background-size:${p.cols * 100}% ${p.rows * 100}%;
      background-position:${px}% ${py}%"></div></div>`;
  }).join('');
  /* keep the board the image's own shape so nothing is stretched */
  const im = new Image();
  im.onload = () => { b.style.aspectRatio = `${im.naturalWidth} / ${im.naturalHeight}`; };
  im.src = p.url;
  $('doneImg').src = p.url;
}

function render(d) {
  if (!d.puzzle || !d.puzzle.url) {
    $('board').innerHTML = '<p class="waiting">no puzzle is live yet 🧩<br />' +
      '<span style="font-size:1.1rem">turn one on in the dashboard</span></p>';
    $('board').style.gridTemplateColumns = '1fr'; $('board').style.gridTemplateRows = '1fr';
    grid = null;
    return;
  }
  if (!grid || grid.url !== d.puzzle.url || grid.cols !== d.puzzle.cols || grid.rows !== d.puzzle.rows) {
    build(d.puzzle);
  }
  $('placed').textContent = d.placed || 0;
  $('people').textContent = d.people || 0;
  $('bar').style.width = d.total ? Math.round((d.placed / d.total) * 100) + '%' : '0%';

  for (const p of d.pieces || []) {
    if (on.has(p.idx)) continue;
    const cell = $('board').querySelector(`.cell[data-i="${p.idx}"]`);
    if (!cell) continue;
    on.add(p.idx);
    cell.classList.add('on');
    /* the name flashes on the piece then fades into the picture — everyone gets to
       see their own bit arrive, which is the reason to do this as a room at all */
    if (p.by && p.by !== 'the room') {
      const tag = document.createElement('span');
      tag.className = 'nm';
      tag.textContent = p.by;
      cell.appendChild(tag);
      setTimeout(() => tag.remove(), 2700);
    }
  }

  if (d.total && d.placed >= d.total && !finished) {
    finished = true;
    /* let the last piece land and its name fade before taking the room */
    setTimeout(() => {
      $('wall').classList.add('done');
      setTimeout(() => { $('done').classList.add('on'); $('doneLine').textContent = ''; }, 900);
    }, 1400);
  }
}

async function open_(pw, quiet) {
  const res = await fetchBoard(pw);
  if (res.ok) {
    PW = pw;
    try { sessionStorage.setItem('ssp-itin', pw); } catch (e) {}
    $('gate').style.display = 'none';
    $('wall').classList.add('on');
    render(res);
    return true;
  }
  if (!quiet) $('gerr').textContent = res.rate ? 'too many tries — give it a while 🙏'
    : res.wrong ? "that's not it 👀" : 'hmm, try again';
  return false;
}

$('gform').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('gpw').value.trim();
  if (v) open_(v, false);
});

setInterval(() => { if (PW && !document.hidden) open_(PW, true); }, POLL);
document.addEventListener('visibilitychange', () => { if (!document.hidden && PW) open_(PW, true); });
/* a reset in the dashboard should take the wall back to an empty grid */
addEventListener('keydown', (e) => { if (e.key === 'r' && e.metaKey) { grid = null; finished = false;
  $('wall').classList.remove('done'); $('done').classList.remove('on'); } });
if (PW) open_(PW, true);
</script>
</body>
</html>
