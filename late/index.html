<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>too late? 🤫 · khushi's slumber party</title>
<meta name="description" content="Applications are closed — but leave your email." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;1,400&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* The you-just-missed-it DM. Applications closed and the gate sends people here
     instead of the form: same bubbles, same room, one question. The look is the
     check-in thread's on purpose — this page IS that conversation, a few hours
     later, so it borrows the whole idiom rather than inventing a sibling. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* the bubbles are <p>s, and the browser's default 1em paragraph margins were
     stacking on top of the thread's own gap — the gap alone IS the spacing */
  p{ margin:0; }
  html,body{ margin:0; min-height:100%; }
  body{ background:
      radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); overflow-x:hidden; }

  .wrap{ max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; }
  .head{ display:flex; align-items:center; gap:.7rem; padding:calc(.9rem + env(safe-area-inset-top,0px)) 1rem .9rem;
    border-bottom:1px solid rgba(245,195,207,.14); position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,rgba(42,21,32,.96),rgba(42,21,32,.82)); backdrop-filter:blur(8px); }
  .av{ width:2.5rem; height:2.5rem; border-radius:100px; overflow:hidden; flex:none;
    border:1px solid rgba(245,195,207,.3); }
  .av img{ width:100%; height:100%; object-fit:cover; display:block; }
  .who{ min-width:0; }
  .who b{ font-family:var(--mono); font-size:1.3rem; letter-spacing:.02em; display:block; line-height:1.1; }
  .who span{ font-size:1.05rem; color:var(--soft); }
  .who span i{ color:#7ddc9b; font-style:normal; }

  .thread{ flex:1; display:flex; flex-direction:column; gap:.45rem; padding:1.1rem .9rem 1.4rem; }

  .msg{ max-width:84%; font-size:1.32rem; line-height:1.3; padding:.5rem .85rem; border-radius:1.15rem;
    white-space:pre-wrap; word-wrap:break-word;
    animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both;
    scroll-margin-bottom:8.5rem; }
  .sys,.done{ scroll-margin-bottom:8.5rem; }
  @keyframes pop{ from{ opacity:0; transform:translateY(.5rem) scale(.97) } to{ opacity:1; transform:none } }
  .her{ align-self:flex-start; background:var(--cream); color:var(--ink); border-bottom-left-radius:.3rem;
    box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .you{ align-self:flex-end; color:#fff; background:linear-gradient(120deg,var(--pink),#d8447a);
    border-bottom-right-radius:.3rem; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  .sys{ align-self:center; text-align:center; font-size:1.05rem; color:rgba(255,246,242,.55);
    background:rgba(255,255,255,.05); border-radius:.8rem; padding:.45rem .9rem; margin:.35rem 0; }
  .typing{ display:flex; gap:.28rem; align-items:center; padding:.75rem .9rem; }
  .typing i{ width:.38rem; height:.38rem; border-radius:100px; background:#b2557d; animation:blink 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.16s } .typing i:nth-child(3){ animation-delay:.32s }
  @keyframes blink{ 0%,60%,100%{ opacity:.35 } 30%{ opacity:1 } }

  .compose{ position:sticky; bottom:0; padding:.7rem .9rem calc(.9rem + env(safe-area-inset-bottom,0px));
    background:#1a0f16; border-top:1px solid rgba(245,195,207,.14); }
  /* the same compose row as /checkin, and the same two fixes: one height for both
     halves so the button can't float short of the field, and 44px because that is
     the smallest thing a thumb reliably hits */
  :root{ --rowH:44px; }
  .row{ display:flex; gap:.5rem; align-items:stretch; }
  .fld{ flex:1; min-width:0; display:flex; align-items:center; gap:.4rem; min-height:var(--rowH);
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.28); border-radius:100px;
    padding:0 .95rem; }
  .fld:focus-within{ border-color:var(--pink); background:rgba(255,255,255,.09); }
  input[type=email]{ flex:1; min-width:0; background:none; border:0; outline:0; padding:0;
    color:var(--cream); font-family:var(--mono); font-size:1.35rem; }
  input::placeholder{ color:rgba(201,160,174,.75); }
  .send{ flex:none; min-height:var(--rowH); border:0; cursor:pointer; border-radius:100px;
    padding:0 1.05rem; font-family:var(--pixel); font-size:.68rem; letter-spacing:.06em; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .send:active{ transform:scale(.97); }
  /* waiting, not broken */
  .send:disabled{ opacity:.62; box-shadow:none; cursor:default; }
  .err{ color:#ffb3c6; font-size:1.1rem; padding:.35rem .3rem 0; min-height:1.4rem; }

  .done{ text-align:center; padding:1.6rem 1rem 2.4rem; }
  .done h1{ font-family:var(--serif); font-style:italic; font-size:2.2rem; margin:.2rem 0 .4rem; }
  .done p{ font-family:var(--hand); font-size:1.5rem; color:#ffd9e4; margin:.2rem 0 .8rem; }
  a.back{ display:inline-block; margin-top:.6rem; color:var(--soft); font-size:1.15rem; }

  /* desktop: the phone in the middle of the room, same as /checkin */
  @media (min-width:800px){
    body{ min-height:100dvh; display:grid; place-items:center; }
    .wrap{ width:min(30rem,100%); min-height:0; height:min(46rem, calc(100dvh - 3rem));
      border-radius:26px; overflow:hidden; border:1px solid rgba(245,195,207,.16);
      box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 100vmax rgba(10,3,8,.5); }
    .thread{ min-height:0; overflow-y:auto; overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch; }
    .thread::-webkit-scrollbar{ width:.3rem; }
    .thread::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:1rem; }
    .msg,.sys,.done{ scroll-margin-bottom:0; }
    .compose{ position:static; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="av"><img src="/assets/khushi-face.png" alt="khushi" /></span>
    <span class="who">
      <b>khushi</b>
      <span>@khushikapoor · <i>●</i> online</span>
    </span>
  </div>

  <div class="thread" id="thread"></div>

  <div class="compose" id="compose" hidden>
    <div id="answer"></div>
    <p class="err" id="err" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- ?v= must match the tag in index.html — see the note there. This file names the
     hour applications closed, and a four-hour-stale config means naming the wrong
     one (or none). Bump both whenever assets/config.js changes. -->
<script src="/assets/config.js?v=2026-08-17-closed"></script>
<script>
/* ============================================================================
   /late — the DM for people who arrived after applications closed.
   The timestamp and one of her lines name the hour; CFG.formCloses in
   assets/config.js is the single source of truth for when that is — the same
   value the gate's countdown runs on — so if the deadline moves, they move
   with it instead of going on saying noon.

   Six of her lines, one question, one row in the database. Nothing here reveals
   anything: no dates, no names beyond hers, no hint of what the something is.
   The whole job of the page is to turn "you missed it" into "you're early for
   the next part" — and to leave with an email.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const thread = document.getElementById('thread');
const compose = document.getElementById('compose');
const answerEl = document.getElementById('answer');
const errEl = document.getElementById('err');

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

/* ---- the same funnel breadcrumbs the main page leaves --------------------- */
function sessionId(){
  try{
    let v = sessionStorage.getItem('ssp-sid');
    if(!v){ v = 'late-' + ((self.crypto && crypto.randomUUID) ? crypto.randomUUID()
                : Date.now() + '-' + Math.random().toString(36).slice(2));
            sessionStorage.setItem('ssp-sid', v); }
    return v;
  }catch(e){ return 'late-anon'; }
}
function visitorId(){
  try{ return localStorage.getItem('ssp-vid') || null; }catch(e){ return null; }
}
function trafficSource(){
  const ua = navigator.userAgent;
  if(/Instagram/i.test(ua)) return 'instagram';
  if(/FBAN|FBAV|FB_IAB/i.test(ua)) return 'facebook';
  if(/Barcelona/i.test(ua)) return 'threads';
  if(/Snapchat/i.test(ua)) return 'snapchat';
  if(/Twitter|X11; U; X/i.test(ua) && /Twitter/i.test(ua)) return 'twitter';
  try{
    const q = new URLSearchParams(location.search);
    const src = q.get('src') || q.get('utm_source');
    if(src) return src.slice(0,40);
  }catch(e){}
  if(document.referrer){ try{ return new URL(document.referrer).hostname; }catch(e){} }
  return 'direct';
}
function track(step){
  if(!(CFG.useSupabase && CFG.supabaseUrl && CFG.supabaseAnonKey)) return;
  try{
    fetch(CFG.supabaseUrl.replace(/\/$/,'') + '/functions/v1/visit', {
      method:'POST', keepalive:true,
      headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey,
                Authorization:'Bearer ' + CFG.supabaseAnonKey },
      body: JSON.stringify({ session_id:sessionId(), reached:step,
        tz:(Intl.DateTimeFormat().resolvedOptions().timeZone || null),
        referrer:document.referrer || null, source:trafficSource(),
        user_agent:navigator.userAgent,
        device:(innerWidth <= 640 ? 'mobile' : 'desktop') })
    }).catch(()=>{});
  }catch(e){}
}

/* ---- the chat engine (same shape as /checkin) ----------------------------- */
function keepUp(el){
  if (getComputedStyle(thread).overflowY === 'auto') {
    thread.scrollTo({ top: thread.scrollHeight, behavior:'smooth' });
  } else {
    el.scrollIntoView({ block:'end', behavior:'smooth' });
  }
}
function bubble(cls, text){
  const p = document.createElement('p');
  p.className = 'msg ' + cls;
  p.textContent = text;
  thread.appendChild(p);
  keepUp(p);
  return p;
}
function sys(text){
  const p = document.createElement('p');
  p.className = 'sys'; p.textContent = text;
  thread.appendChild(p); keepUp(p);
}
async function her(text, beat = 700){
  const t = document.createElement('div');
  t.className = 'msg her typing';
  t.innerHTML = '<i></i><i></i><i></i>';
  thread.appendChild(t); keepUp(t);
  await sleep(beat);
  t.remove();
  return bubble('her', text);
}

/* ---- when the form closed, in her words -----------------------------------
   Two things on this page name the hour out loud — the thread's timestamp and
   her second line — and both are built from CFG.formCloses, the same value the
   gate's countdown runs on. It used to be the literal words "noon today", which
   would have gone on saying noon however far the real deadline moved.

   The hour is read out of Asia/Kolkata on purpose. Formatting in the viewer's
   own timezone would have her tell someone in London the form closed at 6:30am
   — true for their clock, but she is speaking IST, the same reason formCloses
   carries +05:30. */
const CLOSED_AT = new Date(CFG.formCloses);
const istParts = (d) => {
  const f = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Kolkata', hour12:false,
              year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  const o = {}; for(const p of f.formatToParts(d)) o[p.type] = p.value;
  return o;
};
/* "noon" and "midnight" are how a person says those two times; everything else
   gets the clock — 9am, 9:30pm — with a bare :00 dropped, because nobody types
   "9:00am" to a friend. */
function spokenHour(d){
  const p = istParts(d), h = +p.hour, m = +p.minute;
  if(m === 0 && h === 12) return 'noon';
  if(m === 0 && h === 0)  return 'midnight';
  return (h % 12 || 12) + (m ? ':' + String(m).padStart(2,'0') : '') + (h < 12 ? 'am' : 'pm');
}
/* "today" only while it really is still that day in IST. Someone opening this
   page a week late shouldn't be told the form closed this afternoon — after
   yesterday she names the date instead. */
function spokenDay(d){
  const a = istParts(d), now = istParts(new Date()),
        yest = istParts(new Date(Date.now() - 86400000));
  const same = (x, y) => x.day === y.day && x.month === y.month && x.year === y.year;
  if(same(a, now))  return 'today';
  if(same(a, yest)) return 'yesterday';
  return a.day + ' ' + a.month.toLowerCase();
}
/* A missing or malformed formCloses leaves both of these null, and she drops the
   specifics rather than saying "closed at NaN" — still true, just vaguer. */
const CLOSED_DAY  = isNaN(CLOSED_AT) ? null : spokenDay(CLOSED_AT);
const CLOSED_HOUR = isNaN(CLOSED_AT) ? null : spokenHour(CLOSED_AT);
// "at noon today" / "at noon yesterday" / "at noon on 18 aug"
const CLOSED_WHEN = !CLOSED_DAY ? ''
  : ' at ' + CLOSED_HOUR + (CLOSED_DAY === 'today' || CLOSED_DAY === 'yesterday'
                              ? ' ' + CLOSED_DAY : ' on ' + CLOSED_DAY);

/* ---- her side of the conversation ---------------------------------------- */
const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

async function start(){
  track('late_landed');
  sys(CLOSED_DAY ? CLOSED_DAY + ' · just after ' + CLOSED_HOUR : 'today');
  await sleep(500);
  await her('omg hi 🙈', 800);
  await her('you just missed it. applications closed' + CLOSED_WHEN, 900);
  await her("thirty-five spots. i genuinely didn't expect this many of you", 950);
  await her("okay so since you're here — context. the slumber party isn't just a party. i've been building something for months, and the party is the first night of it", 1250);
  await her("the people who applied get to see it first. i can't sneak you past the list — that's the whole point of a secret 🤫", 1100);
  await her("but leave me your email and you're first to know what happens after. and there's a little surprise in it for you", 1000);
  askEmail();
}

function askEmail(){
  compose.hidden = false;
  answerEl.innerHTML =
    '<form class="row" id="f">' +
      '<span class="fld"><input id="em" type="email" placeholder="you@email.com" ' +
        'autocomplete="email" inputmode="email" required /></span>' +
      '<button class="send" type="submit">SEND ▸</button>' +
    '</form>';
  const f = document.getElementById('f'), em = document.getElementById('em');
  em.focus();
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    const val = em.value.trim().toLowerCase();
    if(!EMAIL.test(val)){ errEl.textContent = "that doesn't look like an email 👀"; return; }
    errEl.textContent = '';
    f.querySelector('.send').disabled = true; em.disabled = true;
    bubble('you', val);
    const out = await send(val);
    if(out.ok){
      compose.hidden = true;
      if(out.already){
        await her("wait. you're already on my list 😌", 900);
        await her('patience. check your inbox soon ♡', 800);
      }else{
        await her('tucked in ♡', 800);
        await her('check your inbox soon. and remember — you heard nothing 🤫', 950);
      }
      finish();
    }else{
      // the row didn't land — let them try again rather than pretending it did
      f.querySelector('.send').disabled = false; em.disabled = false;
      errEl.textContent = out.rate
        ? 'too many tries from here — give it a little while 🙏'
        : "ugh, my phone's acting up. try that again?";
    }
  });
}

/* one retry on network/5xx before giving up — same posture as the main form */
async function send(email, attempt = 0){
  if(!(CFG.supabaseUrl && CFG.supabaseAnonKey)) return { ok:false };
  try{
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'') + '/functions/v1/waitlist', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey,
                Authorization:'Bearer ' + CFG.supabaseAnonKey },
      body: JSON.stringify({ email, session_id:sessionId(), visitor_id:visitorId(),
                             source:trafficSource(), user_agent:navigator.userAgent })
    });
    if(r.status === 429) return { ok:false, rate:true };
    if(r.status >= 500 && attempt === 0){ await sleep(900); return send(email, 1); }
    const j = await r.json().catch(() => ({}));
    if(r.ok && j.ok){ track('late_submitted'); return j; }
    return { ok:false };
  }catch(e){
    if(attempt === 0){ await sleep(900); return send(email, 1); }
    return { ok:false };
  }
}

function finish(){
  const d = document.createElement('div');
  d.className = 'done';
  d.innerHTML = '<h1>you heard nothing</h1>' +
    '<p>but you’ll hear from me first ♡</p>' +
    '<a class="back" href="/">‹ back to the party page</a>';
  thread.appendChild(d);
  keepUp(d);
}

start();
</script>
</body>
</html>
