<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow" />
<title>check in · khushi's slumber party</title>
<meta name="description" content="Guest check-in for Khushi's slumber party." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500;1,400&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* Deliberately its own page rather than a step inside /besties: check-in is
     admin, not invitation — it runs after someone already knows they're coming,
     and it must be linkable on its own so it can be re-sent to one person. The
     look is borrowed from the besties thread so it still feels like her. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8; --ink:#2b1a22;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --hand:'Caveat',cursive; --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* the bubbles are <p>s, and the browser's default 1em paragraph margins were
     stacking on top of the thread's own gap — the gap alone IS the spacing */
  p{ margin:0; }
  html,body{ margin:0; min-height:100%; }
  body{ background:
      radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); overflow-x:hidden; }

  /* the phone frame */
  .wrap{ max-width:520px; margin:0 auto; min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column; }
  .head{ display:flex; align-items:center; gap:.7rem; padding:calc(.9rem + env(safe-area-inset-top,0px)) 1rem .9rem;
    border-bottom:1px solid rgba(245,195,207,.14); position:sticky; top:0; z-index:5;
    background:linear-gradient(180deg,rgba(42,21,32,.96),rgba(42,21,32,.82)); backdrop-filter:blur(8px); }
  .av{ width:2.5rem; height:2.5rem; border-radius:100px; overflow:hidden; flex:none;
    border:1px solid rgba(245,195,207,.3); }
  .av img{ width:100%; height:100%; object-fit:cover; display:block; }
  .who{ min-width:0; }
  .who b{ font-family:var(--mono); font-size:1.3rem; letter-spacing:.02em; display:block; line-height:1.1; }
  .who span{ font-size:1.05rem; color:var(--soft); }
  .who span i{ color:#7ddc9b; font-style:normal; }

  .thread{ flex:1; display:flex; flex-direction:column; gap:.45rem; padding:1.1rem .9rem 1.4rem; }

  .msg{ max-width:84%; font-size:1.32rem; line-height:1.3; padding:.5rem .85rem; border-radius:1.15rem;
    white-space:pre-wrap; word-wrap:break-word;
    animation:pop .38s cubic-bezier(.2,.9,.3,1.2) both;
    /* scrollIntoView({block:'end'}) parks a bubble at the bottom of the viewport,
       which is where the sticky compose bar is — so leave it room to clear it */
    scroll-margin-bottom:8.5rem; }
  .sys,.done{ scroll-margin-bottom:8.5rem; }
  @keyframes pop{ from{ opacity:0; transform:translateY(.5rem) scale(.97) } to{ opacity:1; transform:none } }
  .her{ align-self:flex-start; background:var(--cream); color:var(--ink); border-bottom-left-radius:.3rem;
    box-shadow:0 2px 10px rgba(0,0,0,.25); }
  .you{ align-self:flex-end; color:#fff; background:linear-gradient(120deg,var(--pink),#d8447a);
    border-bottom-right-radius:.3rem; box-shadow:0 2px 10px rgba(0,0,0,.3); }
  .sys{ align-self:center; text-align:center; font-size:1.05rem; color:rgba(255,246,242,.55);
    background:rgba(255,255,255,.05); border-radius:.8rem; padding:.45rem .9rem; margin:.35rem 0; }
  .typing{ display:flex; gap:.28rem; align-items:center; padding:.75rem .9rem; }
  .typing i{ width:.38rem; height:.38rem; border-radius:100px; background:#b2557d; animation:blink 1.1s infinite; }
  .typing i:nth-child(2){ animation-delay:.16s } .typing i:nth-child(3){ animation-delay:.32s }
  @keyframes blink{ 0%,60%,100%{ opacity:.35 } 30%{ opacity:1 } }

  /* the answer rail */
  /* Opaque, not translucent-with-blur: a frosted bar over a scrolling thread
     shows the bubble underneath as a smear that reads like a rendering fault. */
  .compose{ position:sticky; bottom:0; padding:.7rem .9rem calc(.9rem + env(safe-area-inset-bottom,0px));
    background:#1a0f16; border-top:1px solid rgba(245,195,207,.14); }
  .row{ display:flex; gap:.5rem; align-items:center; }
  .fld{ flex:1; min-width:0; display:flex; align-items:center; gap:.4rem;
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.28); border-radius:100px;
    padding:.45rem .9rem; }
  .fld span{ color:var(--soft); font-size:1.15rem; flex:none; }
  input[type=text],input[type=tel],input[type=email]{ flex:1; min-width:0; background:none; border:0; outline:0;
    color:var(--cream); font-family:var(--mono); font-size:1.35rem; }
  input::placeholder{ color:rgba(201,160,174,.75); }
  .send{ flex:none; border:0; cursor:pointer; border-radius:100px; padding:.55rem 1.15rem;
    font-family:var(--pixel); font-size:.62rem; letter-spacing:.06em; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); box-shadow:0 .25rem .9rem rgba(235,100,140,.4); }
  .send:disabled{ opacity:.4; box-shadow:none; cursor:default; }
  .chips{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .chip{ cursor:pointer; border:1px solid rgba(245,195,207,.34); background:rgba(255,255,255,.05);
    color:var(--cream); font-family:var(--mono); font-size:1.2rem; border-radius:100px; padding:.4rem .9rem; }
  .chip:active{ transform:scale(.96); }
  .chip.sel{ background:linear-gradient(120deg,var(--pink),#d8447a); border-color:transparent; }
  .err{ color:#ffb3c6; font-size:1.1rem; padding:.35rem .3rem 0; min-height:1.4rem; }

  /* the document step — an attachment, the way a chat does it: a paperclip in
     the compose row, then the file as a chip, then it sends as a photo bubble */
  .attach{ flex:1; min-width:0; display:flex; align-items:center; gap:.5rem; cursor:pointer;
    background:rgba(255,255,255,.06); border:1px solid rgba(245,195,207,.28); border-radius:100px;
    padding:.5rem .95rem; color:var(--soft); font-size:1.25rem; }
  .attach:active{ transform:scale(.99); }
  .attach b{ color:var(--cream); font-weight:400; }
  .attach.has{ border-color:rgba(125,220,155,.45); color:#bfe9cc; }
  .attach .clip{ flex:none; font-size:1.1rem; }
  .attach .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attach img{ flex:none; width:2rem; height:2rem; object-fit:cover; border-radius:.35rem;
    border:1px solid rgba(245,195,207,.3); }
  input[type=file]{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  /* the sent attachment, as a photo message */
  .msg.photo{ padding:.4rem; }
  .msg.photo img{ display:block; max-width:100%; width:min(15rem,52vw); height:auto;
    border-radius:.85rem; }
  .msg.photo .cap{ font-size:1.05rem; opacity:.85; padding:.3rem .35rem .1rem; }
  .msg.photo .pdf{ display:flex; align-items:center; gap:.5rem; padding:.5rem .6rem; font-size:1.2rem; }

  .done{ text-align:center; padding:2rem 1rem 3rem; }
  .done h1{ font-family:var(--serif); font-style:italic; font-size:2.4rem; margin:.2rem 0 .4rem; }
  .done p{ font-family:var(--hand); font-size:1.5rem; color:#ffd9e4; margin:.2rem 0 1.2rem; }
  .lock{ font-size:1.02rem; color:var(--soft); line-height:1.45; max-width:34rem; margin:1.4rem auto 0;
    padding:0 .4rem; }
  .lock a{ color:var(--pink); }
  a.back{ display:inline-block; margin-top:1.2rem; color:var(--soft); font-size:1.15rem; }

  /* ---------------------------------------------------------------- desktop --
     Same treatment as the besties thread: on a wide screen this stops being a
     page and becomes her phone, held in the middle of the room. Stretched across
     a 27" monitor the bubbles read as a web form; at 30rem they read as a DM,
     which is the whole point of doing check-in as a conversation.

     The card is a fixed height, so the thread has to become its own scroll
     container — otherwise `overflow:hidden` on the frame simply clips the
     conversation. That also makes the sticky compose bar redundant here: it sits
     outside the scroller now, permanently at the bottom of the card, so the
     scroll-margin the bubbles carry to clear it is no longer needed. */
  @media (min-width:800px){
    body{ min-height:100dvh; display:grid; place-items:center; }
    .wrap{ width:min(30rem,100%); min-height:0; height:min(46rem, calc(100dvh - 3rem));
      border-radius:26px; overflow:hidden; border:1px solid rgba(245,195,207,.16);
      /* the second shadow is a 100vmax spread — it dims the whole room around
         the phone without needing an overlay element to do it */
      box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 100vmax rgba(10,3,8,.5); }
    /* no scroll-behavior here on purpose — every scrollIntoView call in the flow
       already asks for smooth explicitly, and setting it in CSS too stacks a
       second animation on the same scroll */
    .thread{ min-height:0; overflow-y:auto; overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch; }
    .thread::-webkit-scrollbar{ width:.3rem; }
    .thread::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.14); border-radius:1rem; }
    .msg,.sys,.done{ scroll-margin-bottom:0; }
    /* the frame already ends the page; a sticky bar inside it would be a no-op
       with a border that reads as a seam */
    .compose{ position:static; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="av"><img src="/assets/khushi-face.png" alt="khushi" /></span>
    <span class="who">
      <b>khushi</b>
      <span>@khushikapoor · <i>●</i> checking you in</span>
    </span>
  </div>

  <div class="thread" id="thread"></div>

  <div class="compose" id="compose" hidden>
    <div id="answer"></div>
    <p class="err" id="err" role="status" aria-live="polite"></p>
  </div>
</div>

<!-- before the flow, so CFG is populated by the time anything can be sent -->
<script src="/assets/config.js"></script>
<script>
/* ============================================================================
   /checkin — the guest check-in, as a conversation.

   The questions live in one array, and each one declares how it's answered. The
   whole flow is that array plus a renderer: adding a question is one entry, not
   a new screen. Nothing is submitted until the last step, so a half-finished
   check-in leaves nothing behind.
   ============================================================================ */
const CFG = (window.SLUMBER_CONFIG || {});
const thread = document.getElementById('thread');
const compose = document.getElementById('compose');
const answerEl = document.getElementById('answer');
const errEl = document.getElementById('err');

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const esc = (s) => String(s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

/* Keeps the newest thing in view. Every caller has just appended to the end of
   the thread, so "follow the newest" and "go to the bottom" mean the same thing
   here — which is what makes the desktop branch safe.

   Two branches because there are two scrollers. On a phone the page itself
   scrolls and scrollIntoView is the right call: the bubbles carry a
   scroll-margin so they land clear of the sticky compose bar. Inside the desktop
   card the thread is its own scroller, and there repeated smooth scrollIntoView
   calls do NOT converge — each one interrupts the last and only animates part of
   the way, so a quick run of bubbles leaves the thread stranded partway up with
   the newest message below the fold. Aiming at the container's bottom fixes that
   by construction: every call re-aims at the true end from wherever the previous
   animation got to, and an over-large target simply clamps.
   Read off the computed overflow rather than re-testing the breakpoint in JS, so
   there's only one place the 800px boundary is written down. */
function keepUp(el){
  if (getComputedStyle(thread).overflowY === 'auto') {
    thread.scrollTo({ top: thread.scrollHeight, behavior:'smooth' });
  } else {
    el.scrollIntoView({ block:'end', behavior:'smooth' });
  }
}

function bubble(cls, text){
  const p = document.createElement('p');
  p.className = 'msg ' + cls;
  p.textContent = text;
  thread.appendChild(p);
  keepUp(p);
  return p;
}
function sys(text){
  const p = document.createElement('p');
  p.className = 'sys'; p.textContent = text;
  thread.appendChild(p); keepUp(p);
}
/** her line, with the typing beat first — the pause is what makes it read as
    someone typing rather than a form validating */
async function her(text, beat = 620){
  const t = document.createElement('div');
  t.className = 'msg her typing';
  t.innerHTML = '<i></i><i></i><i></i>';
  thread.appendChild(t); keepUp(t);
  await sleep(beat);
  t.remove();
  return bubble('her', text);
}

/* ------------------------------------------------------------------ the form */
const SIZES = ['XS','S','M','L','XL','XXL'];
const MEALS = [
  { v:'veg',      label:'veg 🥗' },
  { v:'non-veg',  label:'non-veg 🍗' },
  { v:'vegan',    label:'vegan 🌱' },
  { v:'jain',     label:'jain 🙏' },
  { v:'allergic', label:'allergic ⚠️' },
];

const answers = {};

const QS = [
  { key:'name', type:'text', ph:'first & last',
    ask:['okayyy you\'re coming!!! 💌', 'let me get you checked in.', 'what\'s your full name?'],
    check:v => v.trim().length >= 2 ? null : 'need your name for the list' },

  { key:'phone', type:'tel', ph:'10 digits',
    ask:a => [`thanks ${first(a.name)} 🤍`, 'number? i\'ll add you to the group chat.'],
    check:v => /^[6-9]\d{9}$/.test(v.replace(/\D/g,'').slice(-10))
      ? null : 'that doesn\'t look like a mobile number' },

  { key:'email', type:'email', ph:'you@email.com',
    ask:['and your email — that\'s where the address goes 48h before.'],
    check:v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.trim()) ? null : 'that email looks off' },

  { key:'id_doc', type:'file',
    ask:['one boring bit: the building needs an ID for the guest list 🙄',
         'aadhaar or driving licence — a photo is fine.'] },

  { key:'pyjama_size', type:'chips', options:SIZES.map(s => ({ v:s, label:s })),
    ask:['okay fun part.', 'pyjama size? they\'re matching 🎀'] },

  { key:'meal', type:'chips', options:MEALS,
    ask:['and what do you eat?'] },

  { key:'meal_notes', type:'text', ph:'nuts, dairy, gluten…', onlyIf:a => a.meal === 'allergic',
    ask:['what are you allergic to? i\'ll tell the kitchen.'],
    check:v => v.trim().length >= 2 ? null : 'even roughly is fine' },
];

const first = (n) => String(n || '').trim().split(/\s+/)[0] || 'you';

/* ------------------------------------------------------------------- the run */
let qi = -1;

async function next(){
  qi++;
  while (qi < QS.length && QS[qi].onlyIf && !QS[qi].onlyIf(answers)) qi++;
  if (qi >= QS.length) return finish();

  const q = QS[qi];
  const lines = typeof q.ask === 'function' ? q.ask(answers) : q.ask;
  compose.hidden = true;
  for (const line of lines) await her(line);
  compose.hidden = false;
  render(q);
}

function render(q){
  errEl.textContent = '';
  answerEl.innerHTML = '';

  if (q.type === 'chips'){
    const wrap = document.createElement('div');
    wrap.className = 'chips';
    q.options.forEach(o => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = o.label;
      b.addEventListener('click', () => { accept(q, o.v, o.label); });
      wrap.appendChild(b);
    });
    answerEl.appendChild(wrap);
    return;
  }

  if (q.type === 'file'){
    // one row, like every other question: attach on the left, send on the right
    const row = document.createElement('div');
    row.className = 'row';
    const lab = document.createElement('label');
    lab.className = 'attach';
    lab.innerHTML = '<span class="clip">📎</span><span class="nm"><b>attach your ID</b></span>';
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp,application/pdf';
    lab.appendChild(inp);
    const send = document.createElement('button');
    send.className = 'send'; send.textContent = 'SEND ▸'; send.disabled = true;
    row.appendChild(lab); row.appendChild(send);
    answerEl.appendChild(row);

    let thumb = null;
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      errEl.textContent = 'reading…';
      try {
        const prepared = await prepareDoc(f);
        answers.id_doc = prepared.dataUrl;
        answers.id_doc_type = guessDocType(f.name);
        thumb = prepared.thumb;
        lab.classList.add('has');
        lab.innerHTML = prepared.thumb
          ? '<img alt="" src="' + prepared.thumb + '"><span class="nm">' + esc(f.name) + '</span>'
          : '<span class="clip">📄</span><span class="nm">' + esc(f.name) + '</span>';
        lab.appendChild(inp);
        send.disabled = false; errEl.textContent = '';
      } catch (e){
        console.error(e);
        errEl.textContent = e.message || "couldn't read that file";
      }
    });
    send.addEventListener('click', () => {
      if (!answers.id_doc) return;
      // it leaves as a photo message, not the words "sent my ID"
      answers[q.key] = answers.id_doc;
      photoBubble(thumb);
      compose.hidden = true; answerEl.innerHTML = ''; errEl.textContent = '';
      next();
    });
    return;
  }

  // text / tel / email
  const row = document.createElement('div');
  row.className = 'row';
  const fld = document.createElement('div');
  fld.className = 'fld';
  if (q.type === 'tel'){
    const pre = document.createElement('span'); pre.textContent = '+91'; fld.appendChild(pre);
  }
  const inp = document.createElement('input');
  inp.type = q.type; inp.placeholder = q.ph || '';
  inp.autocomplete = q.key === 'name' ? 'name' : q.key === 'email' ? 'email'
    : q.key === 'phone' ? 'tel' : 'off';
  if (q.type === 'tel'){
    /* Stop at ten digits rather than validating after the fact. The field would
       accept twenty and only complain on send, which is a worse way to learn the
       rule — and maxlength alone doesn't hold, because a pasted "+91 98765 43210"
       spends its allowance on punctuation. So strip to digits first, then cap. */
    inp.inputMode = 'numeric';
    inp.maxLength = 10;
    inp.addEventListener('input', () => {
      const raw = inp.value.replace(/\D/g, '');
      /* Keep the LAST ten, not the first. Someone pasting "+91 98765 43210" has
         twelve digits; taking the first ten gives 9198765432 — a plausible-looking
         number that isn't theirs, and it passes every check downstream. The last
         ten drops the country code (and a leading 0) and leaves the real number.
         maxLength already stops an eleventh keystroke, so this is the paste path.
         Same rule the Edge Function uses, so the two can't disagree. */
      const digits = raw.length > 10 ? raw.slice(-10) : raw;
      if (inp.value !== digits) inp.value = digits;
    });
  }
  fld.appendChild(inp);
  const send = document.createElement('button');
  send.className = 'send'; send.textContent = 'SEND ▸'; send.disabled = true;
  row.appendChild(fld); row.appendChild(send);
  answerEl.appendChild(row);

  const sync = () => { send.disabled = !inp.value.trim(); };
  inp.addEventListener('input', sync);
  const go = () => {
    const v = inp.value.trim();
    if (!v) return;
    const bad = q.check ? q.check(v) : null;
    if (bad){ errEl.textContent = bad; return; }
    accept(q, v, v);
  };
  send.addEventListener('click', go);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); go(); } });
  setTimeout(() => inp.focus({ preventScroll:true }), 60);
}

/** the attachment as it leaves — an image shows itself, a pdf gets a paper icon */
function photoBubble(thumb){
  const p = document.createElement('p');
  p.className = 'msg you photo';
  p.innerHTML = thumb
    ? '<img alt="the ID you attached" src="' + thumb + '"><span class="cap">my ID 📎</span>'
    : '<span class="pdf">📄 my ID (pdf)</span>';
  thread.appendChild(p);
  keepUp(p);
}

function accept(q, value, echo){
  answers[q.key] = value;
  bubble('you', echo);
  compose.hidden = true;
  answerEl.innerHTML = '';
  errEl.textContent = '';
  next();
}

const guessDocType = (name) =>
  /aadh|adhaar|uid/i.test(name) ? 'aadhaar' : /licen|dl|driv/i.test(name) ? 'licence' : 'other';

/* Images are downscaled in the browser before they ever leave it. A phone photo
   of a licence is routinely 4-8MB; at 1600px longest edge it's a couple of
   hundred KB and still perfectly legible, which keeps the request small enough
   to send in one piece and means less of someone's ID sitting around than the
   camera produced. PDFs pass through untouched. */
async function prepareDoc(file){
  const MAX_RAW = 8 * 1024 * 1024;
  if (file.size > MAX_RAW) throw new Error('that file is over 8MB — try a photo instead');
  if (file.type === 'application/pdf'){
    return { dataUrl: await readAsDataUrl(file), note: kb(file.size), thumb: null };
  }
  if (!/^image\//.test(file.type)) throw new Error('jpg, png, webp or pdf please');

  const dataUrl = await readAsDataUrl(file);
  const img = await new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i);
    i.onerror = () => rej(new Error("couldn't open that image")); i.src = dataUrl;
  });
  const MAX_EDGE = 1600;
  const scale = Math.min(1, MAX_EDGE / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const out = c.toDataURL('image/jpeg', 0.82);
  return { dataUrl: out, note: `${w}×${h} · ${kb(out.length * 0.75)}`, thumb: out };
}
const kb = (bytes) => bytes > 1024 * 1024
  ? (bytes / 1024 / 1024).toFixed(1) + 'MB' : Math.max(1, Math.round(bytes / 1024)) + 'KB';
const readAsDataUrl = (file) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result));
  r.onerror = () => rej(new Error("couldn't read that file"));
  r.readAsDataURL(file);
});

/* ---------------------------------------------------------------- the finish */
async function finish(){
  compose.hidden = true;
  await her('sending this to the door list…', 420);

  const res = await send();

  if (res.ok && res.duplicate){
    await her(res.message || 'this number is already checked in 💌');
    return outro('already checked in', 'you\'re on the list — nothing more to do.');
  }
  if (!res.ok){
    await her(res.error || 'hmm, that didn\'t go through.');
    sys('nothing was saved. try again in a moment?');
    const again = document.createElement('button');
    again.className = 'send'; again.textContent = 'TRY AGAIN ▸';
    again.style.margin = '.6rem auto 0'; again.style.display = 'block';
    again.addEventListener('click', () => { again.remove(); finish(); });
    thread.appendChild(again);
    keepUp(again);
    return;
  }
  await her('done ✨ you\'re checked in.');
  await her('address + timings land in your inbox 48h before. don\'t tell anyone. x');
  outro('you\'re checked in ✨', 'see you at khushi\'s.');
}

async function send(){
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey){
    console.warn('check-in not configured — nothing was sent', answers);
    return { ok:false, error:'check-in isn\'t switched on yet — tell khushi.' };
  }
  try{
    const r = await fetch(CFG.supabaseUrl.replace(/\/$/,'') + '/functions/v1/checkin', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:CFG.supabaseAnonKey,
                Authorization:'Bearer ' + CFG.supabaseAnonKey },
      body: JSON.stringify({
        name:answers.name, phone:answers.phone, email:answers.email,
        pyjama_size:answers.pyjama_size, meal:answers.meal,
        meal_notes:answers.meal_notes || null,
        id_doc:answers.id_doc, id_doc_type:answers.id_doc_type || 'other',
        tz:(Intl.DateTimeFormat().resolvedOptions().timeZone || null),
        user_agent:navigator.userAgent,
      }),
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) return { ok:false, error:out.error };
    return { ok:true, ...out };
  } catch (e){
    console.error(e);
    return { ok:false, error:'no connection — try again?' };
  }
}

function outro(title, sub){
  const d = document.createElement('div');
  d.className = 'done';
  d.innerHTML = '<h1>' + esc(title) + '</h1><p>' + esc(sub) + '</p>' +
    '<p class="lock">your ID is stored privately and only to get you past the ' +
    'building\'s door list. see the <a href="/privacy.html">privacy policy</a>.</p>' +
    '<a class="back" href="/besties/">‹ back to the invite</a>';
  thread.appendChild(d);
  keepUp(d);
}

/* go */
sys('today · check-in');
next();
</script>
