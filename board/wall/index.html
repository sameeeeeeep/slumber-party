<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>the nail board · the wall</title>
<meta name="description" content="The wall." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:ital,wght@0,500&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
<style>
  /* THE WALL — projected in a room, read from across it, touched by nobody.
     That decides everything: no controls, enormous type, and it has to look
     right at three images and at two hundred. The grid is masonry-by-columns so
     screenshots of any shape sit together without being cropped square, and new
     ones arrive with a little animation because the whole point is watching your
     own appear. */
  :root{
    --wine:#2a1520; --wine-2:#1c1017; --cream:#fff6f8;
    --pink:#eb648c; --rose:#c2456b; --soft:#c9a0ae; --yellow:#ffe9a8;
    --mono:'VT323',monospace; --pixel:'Press Start 2P',monospace;
    --serif:'Playfair Display',serif;
  }
  *{ box-sizing:border-box; }
  p,h1,h2{ margin:0; }
  html,body{ margin:0; height:100%; overflow:hidden; }
  body{ background:radial-gradient(120% 90% at 50% 0%, #3a1c2b 0%, var(--wine) 46%, var(--wine-2) 100%);
    color:var(--cream); font-family:var(--mono); }

  #gate{ height:100%; display:grid; place-items:center; padding:1.4rem; }
  .gbox{ text-align:center; width:min(22rem,100%); }
  .gbox img{ display:block; width:min(74%,15rem); margin:0 auto .8rem; }
  .gbox h1{ font-family:var(--serif); font-style:italic; font-size:1.7rem; margin:0 0 1.1rem; color:#fff; }
  .gbox form{ display:flex; gap:.5rem; }
  .gbox input{ flex:1; min-width:0; background:rgba(255,255,255,.06);
    border:1px solid rgba(245,195,207,.28); border-radius:100px; padding:.6rem 1rem;
    color:var(--cream); font-family:var(--mono); font-size:1.3rem; outline:none; text-align:center; }
  .gbox button{ flex:none; border:0; cursor:pointer; border-radius:100px; padding:.55rem 1.05rem;
    font-family:var(--pixel); font-size:.6rem; color:#fff;
    background:linear-gradient(120deg,var(--pink),#e2703f); }
  .gbox .err{ min-height:1.5rem; margin-top:.7rem; font-size:1.1rem; color:#ffb3c6; }

  /* THE LAYOUT
     Every image the same size meant nothing announced itself — you couldn't tell
     from across the room which one had just landed, which is the entire reason
     people look up. So: the newest upload IS the wall, big, and everything before
     it stacks beside it. The stack shrinks as it grows so two hundred designs
     still fit on one screen without a scrollbar nobody can reach. */
  #wall{ display:none; height:100%; grid-template-rows:1fr auto; }
  #wall.on{ display:grid; }

  .stage{ display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
    gap:.8rem; padding:.9rem .9rem 0; min-height:0; }
  @media (max-aspect-ratio:1/1){ .stage{ grid-template-columns:1fr; grid-template-rows:1.4fr 1fr; } }

  /* the newest one */
  #hero{ position:relative; min-height:0; border-radius:1.1rem; overflow:hidden;
    border:1px solid rgba(245,195,207,.22); background:rgba(255,255,255,.04);
    display:grid; place-items:center; }
  #hero img{ width:100%; height:100%; object-fit:contain; display:block; }
  #hero.pop{ animation:heroIn .6s cubic-bezier(.2,.9,.3,1.15); }
  @keyframes heroIn{ from{ opacity:0; transform:scale(.96); } }
  #hero .cap{ position:absolute; left:0; right:0; bottom:0; padding:1.1rem 1.2rem .9rem;
    background:linear-gradient(transparent, rgba(15,8,12,.88)); display:flex;
    align-items:baseline; gap:.7rem; flex-wrap:wrap; }
  #hero .tg{ font-family:var(--pixel); font-size:1.15rem; color:var(--yellow);
    text-shadow:0 0 18px rgba(255,233,168,.45); }
  #hero .who{ font-family:var(--serif); font-style:italic; font-size:1.9rem; color:#fff; }
  #hero .new{ margin-left:auto; font-family:var(--pixel); font-size:.6rem; letter-spacing:.14em;
    color:#fff; background:var(--rose); border-radius:100px; padding:.4rem .7rem; }
  #hero .col{ color:var(--soft); font-size:1.2rem; }

  /* everything before it */
  #stack{ min-height:0; overflow:hidden; align-content:start;
    display:grid; gap:.5rem; grid-template-columns:repeat(var(--cols,3),minmax(0,1fr)); }
  #stack figure{ margin:0; position:relative; border-radius:.6rem; overflow:hidden;
    border:1px solid rgba(245,195,207,.16); background:rgba(255,255,255,.04);
    animation:pop .5s cubic-bezier(.2,.9,.3,1.2); }
  #stack img{ display:block; width:100%; aspect-ratio:1; object-fit:cover; }
  #stack figcaption{ position:absolute; left:0; right:0; bottom:0; padding:.35rem .4rem .3rem;
    font-size:.92rem; line-height:1.1;
    background:linear-gradient(transparent, rgba(15,8,12,.85)); }
  #stack .tg{ color:var(--yellow); }
  #stack .who{ color:#fff; }
  @keyframes pop{ from{ opacity:0; transform:scale(.9); } }

  .empty{ align-self:center; justify-self:center; text-align:center; color:var(--soft);
    font-size:1.8rem; line-height:1.5; grid-column:1/-1; }

  /* the strip along the bottom: the count, the people, the tally */
  footer{ display:flex; align-items:center; gap:1.4rem; padding:.7rem 1.1rem;
    border-top:1px solid rgba(245,195,207,.14); }
  footer img.logo{ height:2.6rem; }
  .stat{ text-align:center; }
  .big{ font-family:var(--pixel); font-size:1.7rem; color:var(--yellow); line-height:1;
    text-shadow:0 0 18px rgba(255,233,168,.4); }
  .lbl{ font-family:var(--pixel); font-size:.48rem; letter-spacing:.13em; color:var(--soft);
    margin-top:.25rem; }
  .tally{ flex:1; display:flex; gap:.7rem; overflow:hidden; }
  .tally .row{ flex:1 1 0; min-width:0; }
  .tally .top{ display:flex; justify-content:space-between; font-size:1.05rem; gap:.3rem; }
  .tally .top span:first-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tally .n{ color:var(--yellow); font-variant-numeric:tabular-nums; }
  .tally .bar{ height:.36rem; border-radius:100px; background:rgba(255,255,255,.09); margin-top:.25rem; }
  .tally .bar i{ display:block; height:100%; border-radius:100px;
    background:linear-gradient(90deg,var(--pink),var(--yellow)); transition:width .6s; }
</style>
</head>
<body>

<div id="gate">
  <div class="gbox" id="gbox">
    <img src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <h1>the wall</h1>
    <form id="gform">
      <input id="gpw" type="password" autocomplete="off" autocapitalize="none" placeholder="•••••" />
      <button type="submit">OPEN ▸</button>
    </form>
    <p class="err" id="gerr"></p>
  </div>
</div>

<div id="wall">
  <div class="stage">
    <div id="hero"></div>
    <div id="stack"></div>
  </div>
  <footer>
    <img class="logo" src="/assets/logo2.png" alt="Khushi's Secret Slumber Party" />
    <div class="stat"><p class="big" id="total">0</p><p class="lbl">DESIGNS</p></div>
    <div class="stat"><p class="big" id="people">0</p><p class="lbl">PEOPLE</p></div>
    <div class="tally" id="tally"></div>
  </footer>
</div>

<script src="/assets/config.js"></script>
<script>
/* ============================================================================
   /board/wall — the projected side of the nail board.

   Polls rather than subscribes, on purpose. Guests can't read the tables (there
   is no SELECT policy for them), so a realtime subscription would need auth this
   screen doesn't have — and at roughly one upload every five seconds a three
   second poll is indistinguishable from live, with nothing to reconnect when the
   room's wifi hiccups. One screen polling is a rounding error of load.

   Two rules the projector imposes:
     - only redraw what changed. Replacing the grid every three seconds would
       restart every animation and flicker a wall of forty images.
     - newest first, and the newest few glow. People need to spot their own.
   ========================================================================== */
const CFG = window.SLUMBER_CONFIG || {};
const FN = CFG.supabaseUrl.replace(/\/$/, '') + '/functions/v1/board';
const POLL = 3000;
let PW = null;
try { PW = sessionStorage.getItem('ssp-itin'); } catch (e) {}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

async function fetchBoard(pw) {
  const r = await fetch(FN, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CFG.supabaseAnonKey,
               Authorization: 'Bearer ' + CFG.supabaseAnonKey },
    body: JSON.stringify({ password: pw, action: 'board' }),
  });
  if (r.status === 401) return { wrong: true };
  if (r.status === 429) return { rate: true };
  return await r.json().catch(() => ({}));
}

/* How tight the stack packs. Two designs shouldn't be thumbnails and two hundred
   can't be big, so the column count climbs with the pile and everything stays on
   one screen — a projector has no scrollbar anyone can reach. */
function stackCols(n) {
  const tall = innerHeight > innerWidth;      // portrait screen: the stack is a band, not a column
  if (n <= 2) return tall ? 2 : 1;
  if (n <= 6) return tall ? 3 : 2;
  if (n <= 12) return tall ? 4 : 3;
  if (n <= 24) return tall ? 6 : 4;
  if (n <= 48) return tall ? 8 : 6;
  return tall ? 10 : 8;
}

let heroId = null;

function render(d) {
  const posts = d.posts || [];
  document.getElementById('total').textContent = d.total || 0;
  document.getElementById('people').textContent = d.people || 0;

  const hero = document.getElementById('hero'), stack = document.getElementById('stack');

  if (!posts.length) {
    heroId = null;
    hero.innerHTML = '<p class="empty">nothing on the wall yet 💅<br />' +
      '<span style="font-size:1.2rem">open the board on your phone and add the first</span></p>';
    stack.innerHTML = '';
    return;
  }

  /* the newest one IS the wall. Only rebuilt when it actually changes, or every
     poll would restart the animation and flicker the biggest thing on screen. */
  const top = posts[0];
  if (top.id !== heroId) {
    const first = heroId === null;
    heroId = top.id;
    hero.innerHTML = `<img src="${esc(top.url)}" alt="" />
      <div class="cap">
        <span class="tg">${esc(top.tag)}</span>
        ${top.colour ? `<span class="col">${esc(top.colour)}</span>` : ''}
        <span class="who">${esc(top.name)}</span>
        ${first ? '' : '<span class="new">JUST ADDED</span>'}
      </div>`;
    hero.classList.remove('pop'); void hero.offsetWidth; hero.classList.add('pop');
    /* the badge is about the last thirty seconds, not about being first in the
       list — a hero still shouting JUST ADDED ten minutes later is a lie */
    const badge = hero.querySelector('.new');
    if (badge) setTimeout(() => badge.remove(), 30000);
  }

  /* everything before it, newest first. Rebuilt wholesale: they're small, the
     hero is what the eye is on, and keeping a diff in step with a shifting first
     element costs more than it saves. */
  const rest = posts.slice(1);
  stack.style.setProperty('--cols', stackCols(rest.length));
  stack.innerHTML = rest.map((p) => `<figure>
      <img src="${esc(p.url)}" alt="" />
      <figcaption><span class="tg">${esc(p.tag)}</span> <span class="who">${esc(p.name)}</span></figcaption>
    </figure>`).join('');

  const tally = d.tally || [];
  const max = tally[0] ? tally[0].n : 1;
  document.getElementById('tally').innerHTML = tally.slice(0, 6).map((t) =>
    `<div class="row">
       <div class="top"><span>${esc(t.tag)}</span><span class="n">${t.n}</span></div>
       <div class="bar"><i style="width:${Math.round(t.n / max * 100)}%"></i></div>
     </div>`).join('');
}

async function open_(pw, quiet) {
  const res = await fetchBoard(pw);
  if (res.posts || res.ok) {
    PW = pw;
    try { sessionStorage.setItem('ssp-itin', pw); } catch (e) {}
    $('gate').style.display = 'none';
    $('wall').classList.add('on');
    render(res);
    return true;
  }
  if (!quiet) {
    $('gerr').textContent = res.rate ? 'too many tries — give it a while 🙏'
      : res.wrong ? "that's not it 👀" : 'hmm, try again';
  }
  return false;
}

$('gform').addEventListener('submit', (e) => {
  e.preventDefault();
  const v = $('gpw').value.trim();
  if (v) open_(v, false);
});

/* it lives on a wall — it has to keep itself current with nobody touching it */
setInterval(() => { if (PW && !document.hidden) open_(PW, true); }, POLL);
document.addEventListener('visibilitychange', () => { if (!document.hidden && PW) open_(PW, true); });
addEventListener('resize', () => {
  const n = $('stack').children.length;
  $('stack').style.setProperty('--cols', stackCols(n));
});
if (PW) open_(PW, true);
</script>
</body>
</html>
